    function buildZoomPresetMenu() {
      zoomPresetMenu.innerHTML = '';
      ZOOM_PRESET_PERCENTS.forEach(pct => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'zoom-preset-item';
        item.dataset.percent = String(pct);
        item.textContent = pct + '%';
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          applyPresetZoomPercent(pct);
          closeZoomPresetMenu();
        });
        zoomPresetMenu.appendChild(item);
      });
    }

    function openZoomPresetMenu() {
      updateZoomBadge();
      zoomPresetMenu.classList.add('show');
      zoomBadge.classList.add('open');
      const activeItem = zoomPresetMenu.querySelector('.zoom-preset-item.active');
      if (activeItem) {
        activeItem.scrollIntoView({ block: 'nearest' });
      }
    }

    function closeZoomPresetMenu() {
      zoomPresetMenu.classList.remove('show');
      zoomBadge.classList.remove('open');
    }

    function updateZoomBadge() {
      const currentPct = Math.round(viewScale * 100);
      if (zoomBadgeText) {
        zoomBadgeText.textContent = currentPct + '%';
      }
      const items = zoomPresetMenu.querySelectorAll('.zoom-preset-item');
      items.forEach(item => {
        item.classList.toggle('active', parseInt(item.dataset.percent, 10) === currentPct);
      });
    }

    function applyPresetZoomPercent(percent) {
      const targetScale = Math.min(MAX_VIEW_SCALE, Math.max(MIN_VIEW_SCALE, percent / 100));
      const cw = canvas.parentElement.clientWidth || window.innerWidth;
      const ch = canvas.parentElement.clientHeight || window.innerHeight;

      if (groupBounds && (selectedPaths.length > 0 || selectedImages.length > 0 || selectedTexts.length > 0)) {
        const focusX = groupBounds.x + groupBounds.w / 2;
        const focusY = groupBounds.y + groupBounds.h / 2;
        viewScale = targetScale;
        viewOffsetX = (cw / 2) - focusX * viewScale;
        viewOffsetY = (ch / 2) - focusY * viewScale;
        syncPageViewState();
        if (currentTool === 'eraser') updateEraserCursor();
        redraw();
      } else if (targetScale === 1.0 && Math.abs(viewScale - 1.0) < 0.001) {
        resetViewTransform();
        redraw();
      } else {
        applyZoomAtScreenPoint(cw / 2, ch / 2, null, targetScale);
      }
      scheduleSaveProgress(400);
    }

    buildZoomPresetMenu();

    zoomBadge.addEventListener('click', (e) => {
      e.stopPropagation();
      if (zoomPresetMenu.classList.contains('show')) {
        closeZoomPresetMenu();
      } else {
        openZoomPresetMenu();
      }
    });

    zoomPresetMenu.addEventListener('pointerdown', (e) => e.stopPropagation());
    zoomPresetMenu.addEventListener('wheel', (e) => e.stopPropagation(), { passive: true });

    function syncPageViewState() {
      if (pages[currentPageIndex]) {
        pages[currentPageIndex].viewScale = viewScale;
        pages[currentPageIndex].viewOffsetX = viewOffsetX;
        pages[currentPageIndex].viewOffsetY = viewOffsetY;
      }
      updateZoomBadge();
      if (isEditingText) updateInlineEditorGeometry();
    }

    function restoreDefaultCursorForCurrentTool() {
      canvas.style.cursor = '';
      if (spaceKeyPressed) {
        canvas.className = 'pan-grab-cursor';
        return;
      }
      if (currentTool === 'select') {
        canvas.className = 'select-cursor';
      } else if (currentTool === 'text') {
        canvas.className = 'text-cursor';
      } else if (currentTool === 'zoom') {
        canvas.className = zoomMode === 'in' ? 'zoom-in-cursor' : 'zoom-out-cursor';
      } else if (currentTool === 'eraser') {
        updateEraserCursor();
      } else {
        canvas.className = 'brush-cursor';
      }
    }

    const MAX_HISTORY = 50;
    const imageCache = new Map();
    let pendingHistorySnapshot = null;
    let opacityDragSnapshot = null;

    function getCachedImage(src, onLoadCallback) {
      if (imageCache.has(src)) {
        const cached = imageCache.get(src);
        if (cached.complete && cached.naturalWidth > 0) {
          return cached;
        }
      }
      const img = new Image();
      img.onload = () => {
        imageCache.set(src, img);
        if (onLoadCallback) onLoadCallback(img);
      };
      img.src = src;
      imageCache.set(src, img);
      return img;
    }

    function capturePageState(pageIdx = currentPageIndex) {
      const targetPage = pages[pageIdx];
      return {
        paths: targetPage.paths.map(p => ({
          type: p.type,
          color: p.color,
          size: p.size,
          opacity: p.opacity !== undefined ? p.opacity : 1.0,
          rotation: p.rotation || 0,
          noStartTaper: !!p.noStartTaper,
          noEndTaper: !!p.noEndTaper,
          points: p.points.map(pt => ({ x: pt.x, y: pt.y, t: pt.t, p: pt.p }))
        })),
        images: targetPage.images.map(img => ({
          x: img.x,
          y: img.y,
          w: img.w,
          h: img.h,
          src: img.src,
          opacity: img.opacity !== undefined ? img.opacity : 1.0,
          rotation: img.rotation || 0
        })),
        texts: (targetPage.texts || []).map(t => ({
          text: t.text,
          x: t.x,
          y: t.y,
          w: t.w,
          h: t.h,
          fontSize: t.fontSize,
          color: t.color,
          opacity: t.opacity !== undefined ? t.opacity : 1.0,
          rotation: t.rotation || 0
        }))
      };
    }

    function isSamePageState(s1, s2) {
      if (!s1 || !s2) return false;
      if (
        s1.paths.length !== s2.paths.length ||
        s1.images.length !== s2.images.length ||
        (s1.texts || []).length !== (s2.texts || []).length
      ) return false;
      return JSON.stringify(s1) === JSON.stringify(s2);
    }

    function restorePageState(snapshot, pageIdx = currentPageIndex) {
      const targetPage = pages[pageIdx];
      targetPage.paths = snapshot.paths.map(p => ({
        type: p.type,
        color: p.color,
        size: p.size,
        opacity: p.opacity !== undefined ? p.opacity : 1.0,
        rotation: p.rotation || 0,
        noStartTaper: !!p.noStartTaper,
        noEndTaper: !!p.noEndTaper,
        points: p.points.map(pt => ({ x: pt.x, y: pt.y, t: pt.t, p: pt.p }))
      }));

      targetPage.images = snapshot.images.map(imgItem => {
        const img = getCachedImage(imgItem.src, () => {
          if (pageIdx === currentPageIndex) redraw();
        });
        if (img.complete && img.naturalWidth > 0) {
          imageCache.set(imgItem.src, img);
        }
        return {
          img: img,
          x: imgItem.x,
          y: imgItem.y,
          w: imgItem.w,
          h: imgItem.h,
          src: imgItem.src,
          opacity: imgItem.opacity !== undefined ? imgItem.opacity : 1.0,
          rotation: imgItem.rotation || 0
        };
      });

      targetPage.texts = (snapshot.texts || []).map(tItem => {
        const tObj = {
          text: tItem.text,
          x: tItem.x,
          y: tItem.y,
          w: tItem.w,
          h: tItem.h,
          fontSize: tItem.fontSize || 32,
          color: tItem.color || '#000000',
          opacity: tItem.opacity !== undefined ? tItem.opacity : 1.0,
          rotation: tItem.rotation || 0
        };
        measureTextObject(tObj);
        return tObj;
      });

      if (pageIdx === currentPageIndex) {
        paths = targetPage.paths;
        images = targetPage.images;
        texts = targetPage.texts;
      }
    }

    function pushHistorySnapshot(snapshot, pageIdx = currentPageIndex) {
      if (!snapshot) return;
      const targetPage = pages[pageIdx];
      if (!targetPage.undoStack) targetPage.undoStack = [];
      if (!targetPage.redoStack) targetPage.redoStack = [];

      targetPage.undoStack.push(snapshot);
      if (targetPage.undoStack.length > MAX_HISTORY) {
        targetPage.undoStack.shift();
      }
      targetPage.redoStack = [];
      if (pageIdx === currentPageIndex) updateUndoRedoButtons();
    }

    function recordUndoStep(pageIdx = currentPageIndex) {
      pushHistorySnapshot(capturePageState(pageIdx), pageIdx);
    }

    function updateUndoRedoButtons() {
      const page = pages[currentPageIndex];
      const canUndo = page && page.undoStack && page.undoStack.length > 0;
      const canRedo = page && page.redoStack && page.redoStack.length > 0;
      undoBtn.disabled = !canUndo;
      redoBtn.disabled = !canRedo;
    }

    function resetSelectionState() {
      selectedPaths = [];
      selectedImages = [];
      selectedTexts = [];
      groupBounds = null;
      origGroupBounds = null;
      selectionBox = null;
      isSelecting = false;
      interactionState = null;
      topRightMenuWrapper.style.display = 'none';
      objectMenu.classList.remove('show');
      opacitySubPanel.classList.remove('show');
      canvasMenu.style.display = 'none';
      updateTextFloatingBarVisibility();
    }

    function undoAction() {
      commitInlineTextEditor(false);
      const page = pages[currentPageIndex];
      if (!page || !page.undoStack || page.undoStack.length === 0) return;

      const currentSnapshot = capturePageState(currentPageIndex);
      page.redoStack.push(currentSnapshot);
      const prevSnapshot = page.undoStack.pop();

      resetSelectionState();
      restorePageState(prevSnapshot, currentPageIndex);
      updateUndoRedoButtons();
      redraw();
      saveProgress();
    }

    function redoAction() {
      commitInlineTextEditor(false);
      const page = pages[currentPageIndex];
      if (!page || !page.redoStack || page.redoStack.length === 0) return;

      const currentSnapshot = capturePageState(currentPageIndex);
      page.undoStack.push(currentSnapshot);
      const nextSnapshot = page.redoStack.pop();

      resetSelectionState();
      restorePageState(nextSnapshot, currentPageIndex);
      updateUndoRedoButtons();
      redraw();
      saveProgress();
    }

    undoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      undoAction();
    });

    redoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      redoAction();
    });

    function scheduleRedraw() {
      if (redrawPending) return;
      redrawPending = true;
      requestAnimationFrame(() => {
        redrawPending = false;
        redraw();
      });
    }

    function openWhiteboardDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject("No IndexedDB");
        const req = indexedDB.open('fudy_whiteboard_db', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('state')) {
            db.createObjectStore('state');
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    let saveDebounceTimer = null;
    let isSavingProgress = false;
    let pendingSaveProgress = false;

    function scheduleSaveProgress(delay = 400) {
      if (isLoggingOut) return;
      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(() => {
        saveProgress();
      }, delay);
    }

    async function saveProgress() {
      if (isLoggingOut) return;
      clearTimeout(saveDebounceTimer);
      if (isSavingProgress) {
        pendingSaveProgress = true;
        return;
      }
      isSavingProgress = true;

      try {
        syncPageViewState();
        const serializedPages = pages.map(page => ({
          paths: page.paths,
          texts: (page.texts || []).map(t => ({
            text: t.text,
            x: t.x,
            y: t.y,
            w: t.w,
            h: t.h,
            fontSize: t.fontSize,
            color: t.color,
            opacity: t.opacity !== undefined ? t.opacity : 1.0,
            rotation: t.rotation || 0
          })),
          viewScale: page.viewScale !== undefined ? page.viewScale : 1.0,
          viewOffsetX: page.viewOffsetX !== undefined ? page.viewOffsetX : 0,
          viewOffsetY: page.viewOffsetY !== undefined ? page.viewOffsetY : 0,
          images: page.images.map(img => ({
            x: img.x, y: img.y, w: img.w, h: img.h,
            src: img.src,
            opacity: img.opacity !== undefined ? img.opacity : 1.0,
            rotation: img.rotation || 0
          }))
        }));

        const payload = {
          version: 3,
          currentPageIndex: currentPageIndex,
          pages: serializedPages
        };

        try {
          const db = await openWhiteboardDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction('state', 'readwrite');
            tx.objectStore('state').put(payload, 'fudy_canvas_progress');
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        } catch (err) {
          try {
            localStorage.setItem('fudy_canvas_progress', JSON.stringify(payload));
          } catch (e) {}
        }
      } finally {
        isSavingProgress = false;
        if (pendingSaveProgress && !isLoggingOut) {
          pendingSaveProgress = false;
          saveProgress();
        }
      }
    }

    async function loadProgress() {
      let rawSaved = null;
      try {
        const db = await openWhiteboardDB();
        rawSaved = await new Promise((resolve) => {
          const tx = db.transaction('state', 'readonly');
          const req = tx.objectStore('state').get('fudy_canvas_progress');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (err) {}

      if (!rawSaved) {
        try {
          const savedStr = localStorage.getItem('fudy_canvas_progress');
          if (savedStr) rawSaved = JSON.parse(savedStr);
        } catch (e) {}
      }

      let parsedPages = null;
      let savedPageIdx = 0;

      if (Array.isArray(rawSaved)) {
        parsedPages = rawSaved;
      } else if (rawSaved && Array.isArray(rawSaved.pages)) {
        parsedPages = rawSaved.pages;
        savedPageIdx = typeof rawSaved.currentPageIndex === 'number' ? rawSaved.currentPageIndex : 0;
      }

      if (parsedPages && parsedPages.length > 0) {
        pages = parsedPages.map(p => {
          const restoredPaths = (p.paths || []).map(pathObj => {
            const copy = {
              type: pathObj.type,
              color: pathObj.color,
              size: pathObj.size,
              opacity: pathObj.opacity !== undefined ? pathObj.opacity : 1.0,
              rotation: pathObj.rotation || 0,
              noStartTaper: !!pathObj.noStartTaper,
              noEndTaper: !!pathObj.noEndTaper,
              points: (pathObj.points || []).map(pt => ({ x: pt.x, y: pt.y, t: pt.t, p: pt.p }))
            };
            if (copy.rotation) bakePathRotation(copy);
            return copy;
          });
          const restoredTexts = (p.texts || []).map(tObj => {
            const copy = {
              text: tObj.text || '',
              x: tObj.x || 0,
              y: tObj.y || 0,
              w: tObj.w || 40,
              h: tObj.h || 40,
              fontSize: tObj.fontSize || 32,
              color: tObj.color || '#000000',
              opacity: tObj.opacity !== undefined ? tObj.opacity : 1.0,
              rotation: tObj.rotation || 0
            };
            measureTextObject(copy);
            return copy;
          });
          return {
            paths: restoredPaths,
            images: [],
            texts: restoredTexts,
            undoStack: [],
            redoStack: [],
            viewScale: p.viewScale !== undefined ? p.viewScale : 1.0,
            viewOffsetX: p.viewOffsetX !== undefined ? p.viewOffsetX : 0,
            viewOffsetY: p.viewOffsetY !== undefined ? p.viewOffsetY : 0
          };
        });

        const targetIdx = Math.min(Math.max(0, savedPageIdx), pages.length - 1);

        parsedPages.forEach((p, pIdx) => {
          if (p.images && p.images.length > 0) {
            p.images.forEach(imgItem => {
              const img = getCachedImage(imgItem.src, () => {
                if (pIdx === currentPageIndex) redraw();
              });
              pages[pIdx].images.push({
                img: img, x: imgItem.x, y: imgItem.y, w: imgItem.w, h: imgItem.h,
                src: imgItem.src,
                opacity: imgItem.opacity !== undefined ? imgItem.opacity : 1.0,
                rotation: imgItem.rotation || 0
              });
              if (img.complete && pIdx === currentPageIndex) redraw();
            });
          }
        });
        switchPage(targetIdx);
      } else {
        updateZoomBadge();
        updateUndoRedoButtons();
      }
    }

    function initCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      redraw();
    }

    window.addEventListener('resize', () => {
      if (loginOverlay.style.display === 'none' && bootScreen.style.display === 'none') {
        initCanvas();
        if (isEditingText) updateInlineEditorGeometry();
      }
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        if (loginOverlay.style.display === 'none' && bootScreen.style.display === 'none') {
          initCanvas();
          if (isEditingText) updateInlineEditorGeometry();
        }
      }, 250);
    });

    function updatePageIndicator() {
      pageIndicator.textContent = `${currentPageIndex + 1}/${pages.length}`;
    }

    function resetViewTransform() {
      viewScale = 1.0;
      viewOffsetX = 0;
      viewOffsetY = 0;
      syncPageViewState();
      if (currentTool === 'eraser') updateEraserCursor();
    }

    function restoreOriginalZoomScale() {
      const cw = canvas.parentElement.clientWidth || window.innerWidth;
      const ch = canvas.parentElement.clientHeight || window.innerHeight;
      if (groupBounds && (selectedPaths.length > 0 || selectedImages.length > 0 || selectedTexts.length > 0)) {
        const focusX = groupBounds.x + groupBounds.w / 2;
        const focusY = groupBounds.y + groupBounds.h / 2;
        viewScale = 1.0;
        viewOffsetX = (cw / 2) - focusX;
        viewOffsetY = (ch / 2) - focusY;
        syncPageViewState();
        if (currentTool === 'eraser') updateEraserCursor();
      } else {
        resetViewTransform();
      }
      redraw();
      saveProgress();
    }

    function switchPage(index) {
      if (index < 0 || index >= pages.length) return;
      commitInlineTextEditor(false);
      syncPageViewState();
      currentPageIndex = index;
      const page = pages[currentPageIndex];
      if (!page.undoStack) page.undoStack = [];
      if (!page.redoStack) page.redoStack = [];
      if (!page.texts) page.texts = [];
      paths = page.paths;
      images = page.images;
      texts = page.texts;
      viewScale = page.viewScale !== undefined ? page.viewScale : 1.0;
      viewOffsetX = page.viewOffsetX !== undefined ? page.viewOffsetX : 0;
      viewOffsetY = page.viewOffsetY !== undefined ? page.viewOffsetY : 0;
      syncPageViewState();
      selectedPaths = []; selectedImages = []; selectedTexts = []; groupBounds = null; origGroupBounds = null;
      opacitySubPanel.classList.remove('show');
      if (currentTool === 'eraser') updateEraserCursor();
      updatePageIndicator();
      updateUndoRedoButtons();
      updateTextFloatingBarVisibility();
      redraw();
    }

    newPageBtn.addEventListener('click', () => {
      commitInlineTextEditor(false);
      pages.push({ paths: [], images: [], texts: [], undoStack: [], redoStack: [], viewScale: 1.0, viewOffsetX: 0, viewOffsetY: 0 });
      switchPage(pages.length - 1);
      saveProgress();
    });

    deletePageBtn.addEventListener('click', () => {
      commitInlineTextEditor(false);
      if (pages.length <= 1) {
        if (confirm("目前只有 1 頁，是否要直接清空本頁內容？")) clearBtn.click();
        return;
      }
      if (confirm(`確定要刪除「第 ${currentPageIndex + 1} 頁」嗎？`)) {
        pages.splice(currentPageIndex, 1);
        if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1;
        switchPage(currentPageIndex);
        saveProgress();
      }
    });

    prevPageBtn.addEventListener('click', () => {
      if (currentPageIndex > 0) {
        switchPage(currentPageIndex - 1);
        scheduleSaveProgress(300);
      }
    });
    nextPageBtn.addEventListener('click', () => {
      if (currentPageIndex < pages.length - 1) {
        switchPage(currentPageIndex + 1);
        scheduleSaveProgress(300);
      }
    });

    let dragCounter = 0;

    function showLoadingToast(text) {
      fileLoadingText.textContent = text;
      fileLoadingToast.style.display = 'flex';
    }

    function hideLoadingToast() {
      fileLoadingToast.style.display = 'none';
    }

    function calculateFittedSize(natW, natH, maxRatioW = 0.80, maxRatioH = 0.86, ignoreViewScale = false) {
      const cw = canvas.parentElement.clientWidth || 800;
      const ch = canvas.parentElement.clientHeight || 600;
      const effectiveScale = ignoreViewScale ? 1.0 : viewScale;
      const maxW = Math.max(120 / effectiveScale, (cw * maxRatioW) / effectiveScale);
      const maxH = Math.max(120 / effectiveScale, (ch * maxRatioH) / effectiveScale);
      let w = natW / effectiveScale;
      let h = natH / effectiveScale;
      if (w > maxW || h > maxH) {
        const scale = Math.min(maxW / w, maxH / h);
        w = w * scale;
        h = h * scale;
      }
      return { w, h, cw, ch };
    }

    function placeDataUrlOnPage(pageIdx, dataUrl, dropPos, offsetIdx = 0, centerOnPage = false, recordUndo = true, ignoreViewScale = false) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          imageCache.set(dataUrl, img);
          if (recordUndo) recordUndoStep(pageIdx);

          const { w, h, cw, ch } = calculateFittedSize(img.naturalWidth || img.width, img.naturalHeight || img.height, 0.80, 0.86, ignoreViewScale);
          let x, y;
          if (centerOnPage || !dropPos) {
            const targetPage = pages[pageIdx];
            const pScale = ignoreViewScale ? 1.0 : (targetPage.viewScale || 1.0);
            const pOffX = ignoreViewScale ? 0 : (targetPage.viewOffsetX || 0);
            const pOffY = ignoreViewScale ? 0 : (targetPage.viewOffsetY || 0);
            const viewCenterX = ((cw / 2) - pOffX) / pScale;
            const viewCenterY = ((ch / 2) - pOffY) / pScale;
            x = viewCenterX - w / 2;
            y = viewCenterY - h / 2;
          } else {
            const cascade = (offsetIdx * 24) / viewScale;
            x = dropPos.x - w / 2 + cascade;
            y = dropPos.y - h / 2 + cascade;
          }

          pages[pageIdx].images.push({
            img: img,
            x: x,
            y: y,
            w: w,
            h: h,
            src: dataUrl,
            opacity: 1.0,
            rotation: 0
          });

          if (pageIdx === currentPageIndex) {
            images = pages[currentPageIndex].images;
            redraw();
          }
          resolve();
        };
        img.onerror = () => resolve();
        img.src = dataUrl;
      });
    }

    function importImageFile(file, dropPos, offsetIdx, centerOnPage = false) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = async (ev) => {
          await placeDataUrlOnPage(currentPageIndex, ev.target.result, dropPos, offsetIdx, centerOnPage, true, false);
          resolve();
        };
        reader.onerror = () => resolve();
        reader.readAsDataURL(file);
      });
    }

    async function importPdfFile(file) {
      if (!window.pdfjsLib) {
        alert("PDF 解析模組尚未載入完成，請確認網路連線後再試一次。");
        return;
      }
      commitInlineTextEditor(false);
      showLoadingToast(`正在解析 PDF：${file.name}...`);
      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdf.numPages;
        const startPageIdx = currentPageIndex;
        const isStartPageEmpty = pages[startPageIdx].paths.length === 0 && pages[startPageIdx].images.length === 0 && (pages[startPageIdx].texts || []).length === 0;
        const firstTargetIdx = isStartPageEmpty ? startPageIdx : (startPageIdx + 1);

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          showLoadingToast(`正在匯入 PDF（第 ${pageNum} / ${totalPages} 頁）...`);
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.6 });

          const offCanvas = document.createElement('canvas');
          offCanvas.width = Math.round(viewport.width);
          offCanvas.height = Math.round(viewport.height);
          const offCtx = offCanvas.getContext('2d');

          offCtx.fillStyle = '#ffffff';
          offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);

          await page.render({ canvasContext: offCtx, viewport: viewport }).promise;
          const dataUrl = offCanvas.toDataURL('image/png');

          const targetPageIdx = firstTargetIdx + (pageNum - 1);
          if (!(pageNum === 1 && isStartPageEmpty)) {
            pages.splice(targetPageIdx, 0, {
              paths: [],
              images: [],
              texts: [],
              undoStack: [],
              redoStack: [],
              viewScale: 1.0,
              viewOffsetX: 0,
              viewOffsetY: 0
            });
          } else {
            pages[targetPageIdx].viewScale = 1.0;
            pages[targetPageIdx].viewOffsetX = 0;
            pages[targetPageIdx].viewOffsetY = 0;
          }

          await placeDataUrlOnPage(targetPageIdx, dataUrl, null, 0, true, true, true);
        }

        switchPage(firstTargetIdx);
        saveProgress();
      } catch (err) {
        console.error("PDF 匯入失敗：", err);
        alert(`無法開啟 PDF 檔案「${file.name}」，請確認檔案未受密碼保護或未損毀。`);
      } finally {
        hideLoadingToast();
      }
    }

    async function handleIncomingFiles(fileList, dropPos = null, centerOnPage = false) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;

      const imageExtRegex = /\.(jpe?g|png|gif|webp|bmp|svg|ico|heic|heif|tiff?)$/i;
      let imgOffset = 0;
      let hasUnsupported = false;

      for (const file of files) {
        const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
        const isImg = (file.type && file.type.startsWith('image/')) || imageExtRegex.test(file.name);

        if (isPdf) {
          await importPdfFile(file);
        } else if (isImg) {
          showLoadingToast(`正在載入圖片：${file.name}...`);
          await importImageFile(file, dropPos, imgOffset++, centerOnPage);
          hideLoadingToast();
        } else {
          hasUnsupported = true;
        }
      }

      saveProgress();
      if (hasUnsupported) {
        alert("部分檔案格式不支援！請選擇 PDF 或圖片檔（JPG、PNG、WEBP、GIF 等）。");
      }
    }

    openFileBtn.addEventListener('click', () => {
      commitInlineTextEditor(false);
      filePickerInput.value = '';
      filePickerInput.click();
    });

    filePickerInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleIncomingFiles(e.target.files, null, true);
      }
    });

    window.addEventListener('paste', (e) => {
      if (loginOverlay.style.display !== 'none' || bootScreen.style.display !== 'none') return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length > 0) {
        e.preventDefault();
        handleIncomingFiles(e.clipboardData.files, null, true);
      } else if (clipboard.paths.length > 0 || clipboard.images.length > 0 || (clipboard.texts || []).length > 0) {
        e.preventDefault();
        pasteClipboardAt();
      }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());

    canvasContainer.addEventListener('dragenter', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (loginOverlay.style.display !== 'none' || bootScreen.style.display !== 'none') return;
      if (e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.includes('Files')) {
        dragCounter++;
        dropOverlay.classList.add('show');
      }
    });

    canvasContainer.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    });

    canvasContainer.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.classList.remove('show');
      }
    });

    canvasContainer.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragCounter = 0;
      dropOverlay.classList.remove('show');
      if (loginOverlay.style.display !== 'none' || bootScreen.style.display !== 'none') return;

      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const rect = canvas.getBoundingClientRect();
        const wp = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
        handleIncomingFiles(e.dataTransfer.files, wp, false);
      }
    });

    function startSparkleAnimation() {
      if (sparkleAnimFrame) cancelAnimationFrame(sparkleAnimFrame);
      function loop() {
        const hasSparkle = paths.some(p => p.type === 'sparkle');
        if (hasSparkle && !interactionState) {
          scheduleRedraw();
        }
        sparkleAnimFrame = requestAnimationFrame(loop);
      }
      loop();
    }

    function renderPageContent(targetCtx) {
      images.forEach(imgObj => {
        if (imgObj.img && imgObj.img.complete && imgObj.img.naturalWidth > 0) {
          targetCtx.save();
          targetCtx.globalAlpha = imgObj.opacity !== undefined ? imgObj.opacity : 1.0;
          if (imgObj.rotation) {
            const cx = imgObj.x + imgObj.w / 2, cy = imgObj.y + imgObj.h / 2;
            targetCtx.translate(cx, cy); targetCtx.rotate(imgObj.rotation); targetCtx.translate(-cx, -cy);
          }
          targetCtx.drawImage(imgObj.img, imgObj.x, imgObj.y, imgObj.w, imgObj.h);
          targetCtx.restore();
        }
      });

      (texts || []).forEach(tObj => {
        if (isEditingText && tObj === editingTextObj) return;
        if (!tObj.text) return;
        measureTextObject(tObj);
        targetCtx.save();
        targetCtx.globalAlpha = tObj.opacity !== undefined ? tObj.opacity : 1.0;
        if (tObj.rotation) {
          const cx = tObj.x + tObj.w / 2, cy = tObj.y + tObj.h / 2;
          targetCtx.translate(cx, cy); targetCtx.rotate(tObj.rotation); targetCtx.translate(-cx, -cy);
        }
        const fontSize = tObj.fontSize || 32;
        const lineHeight = fontSize * TEXT_LINE_HEIGHT_RATIO;
        targetCtx.font = `${fontSize}px ${TEXT_FONT_FAMILY}`;
        targetCtx.fillStyle = tObj.color || '#000000';
        targetCtx.textBaseline = 'top';
        const lines = tObj.text.split('\n');
        for (let i = 0; i < lines.length; i++) {
          targetCtx.fillText(lines[i], tObj.x + 4, tObj.y + 2 + i * lineHeight);
        }
        targetCtx.restore();
      });

      paths.forEach(p => {
        if (!p.points || p.points.length === 0) return;
        targetCtx.save();
        targetCtx.lineCap = 'round'; targetCtx.lineJoin = 'round';
        let pathOpacity = p.opacity !== undefined ? p.opacity : 1.0;

        if (p.rotation) {
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          p.points.forEach(pt => {
            if (pt.x < minX) minX = pt.x; if (pt.y < minY) minY = pt.y;
            if (pt.x > maxX) maxX = pt.x; if (pt.y > maxY) maxY = pt.y;
          });
          const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
          targetCtx.translate(cx, cy); targetCtx.rotate(p.rotation); targetCtx.translate(-cx, -cy);
        }

        if (p.type === 'highlighter') {
          targetCtx.strokeStyle = p.color; targetCtx.lineWidth = p.size * 2.5; targetCtx.globalAlpha = 0.22 * pathOpacity;
          drawSimplePathOn(targetCtx, p.points);
        } else if (p.type === 'soft') {
          targetCtx.strokeStyle = p.color; targetCtx.globalAlpha = pathOpacity;
          drawSoftPathOn(targetCtx, p.points, p.size, p);
        } else if (p.type === 'sparkle') {
          drawSparklePathOn(targetCtx, p, pathOpacity);
        } else {
          targetCtx.strokeStyle = p.color; targetCtx.lineWidth = p.size; targetCtx.globalAlpha = pathOpacity;
          drawSimplePathOn(targetCtx, p.points);
        }
        targetCtx.restore();
      });
    }

    function redraw() {
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, width, height);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(viewOffsetX, viewOffsetY);
      ctx.scale(viewScale, viewScale);

      renderPageContent(ctx);

      if (currentTool === 'select') {
        if (isSelecting) {
          ctx.save();
          ctx.strokeStyle = '#007bff'; ctx.lineWidth = 1.5 / viewScale; ctx.setLineDash([4 / viewScale, 4 / viewScale]);
          ctx.strokeRect(selectionBox.x, selectionBox.y, selectionBox.w, selectionBox.h);
          ctx.fillStyle = 'rgba(0, 123, 255, 0.08)'; ctx.fillRect(selectionBox.x, selectionBox.y, selectionBox.w, selectionBox.h);
          ctx.restore();
        } else if (groupBounds && (selectedPaths.length > 0 || selectedImages.length > 0 || selectedTexts.length > 0)) {
          const invS = 1 / viewScale;
          ctx.save();
          ctx.strokeStyle = '#007bff'; ctx.lineWidth = 2 * invS; ctx.setLineDash([4 * invS, 4 * invS]);
          ctx.strokeRect(groupBounds.x, groupBounds.y, groupBounds.w, groupBounds.h);

          const handleSize = 10 * invS;
          ctx.setLineDash([]);

          const rotX = groupBounds.x + groupBounds.w / 2, rotY = groupBounds.y - 26 * invS;
          ctx.beginPath(); ctx.moveTo(rotX, groupBounds.y); ctx.lineTo(rotX, rotY);
          ctx.strokeStyle = '#007bff'; ctx.lineWidth = 1.5 * invS; ctx.stroke();
          ctx.fillStyle = '#28a745'; ctx.beginPath(); ctx.arc(rotX, rotY, 7 * invS, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          const nX = groupBounds.x + groupBounds.w / 2, nY = groupBounds.y;
          const sX = groupBounds.x + groupBounds.w / 2, sY = groupBounds.y + groupBounds.h;
          ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#007bff'; ctx.lineWidth = 2 * invS;
          ctx.fillRect(nX - 7 * invS, nY - 3.5 * invS, 14 * invS, 7 * invS);
          ctx.strokeRect(nX - 7 * invS, nY - 3.5 * invS, 14 * invS, 7 * invS);
          ctx.fillRect(sX - 7 * invS, sY - 3.5 * invS, 14 * invS, 7 * invS);
          ctx.strokeRect(sX - 7 * invS, sY - 3.5 * invS, 14 * invS, 7 * invS);

          const wX = groupBounds.x, wY = groupBounds.y + groupBounds.h / 2;
          const eX = groupBounds.x + groupBounds.w, eY = groupBounds.y + groupBounds.h / 2;
          ctx.fillRect(wX - 3.5 * invS, wY - 7 * invS, 7 * invS, 14 * invS);
          ctx.strokeRect(wX - 3.5 * invS, wY - 7 * invS, 7 * invS, 14 * invS);
          ctx.fillRect(eX - 3.5 * invS, eY - 7 * invS, 7 * invS, 14 * invS);
          ctx.strokeRect(eX - 3.5 * invS, eY - 7 * invS, 7 * invS, 14 * invS);

          const swX = groupBounds.x, swY = groupBounds.y + groupBounds.h;
          ctx.fillStyle = '#ffc107'; ctx.strokeStyle = '#007bff'; ctx.lineWidth = 2 * invS;
          ctx.fillRect(swX - handleSize/2, swY - handleSize/2, handleSize, handleSize);
          ctx.strokeRect(swX - handleSize/2, swY - handleSize/2, handleSize, handleSize);

          ctx.restore();

          const screenRightX = (groupBounds.x + groupBounds.w) * viewScale + viewOffsetX;
          const screenTopY = groupBounds.y * viewScale + viewOffsetY;
          topRightMenuWrapper.style.display = 'block';
          topRightMenuWrapper.style.left = Math.min(width - 44, Math.max(8, screenRightX - 17)) + 'px';
          topRightMenuWrapper.style.top = Math.min(height - 44, Math.max(8, screenTopY - 38)) + 'px';
        } else {
          topRightMenuWrapper.style.display = 'none';
          objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show');
        }
      } else {
        topRightMenuWrapper.style.display = 'none';
        objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show');
      }

      if (currentTool === 'eraser' && eraserType === 'lasso' && lassoPoints.length > 1) {
        ctx.save();
        ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 2 / viewScale; ctx.setLineDash([5 / viewScale, 5 / viewScale]);
        ctx.beginPath(); ctx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
        for (let i = 1; i < lassoPoints.length; i++) ctx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
        ctx.stroke(); ctx.restore();
      }

      if (currentTool === 'eraser' && eraserType === 'normal' && activeTouchEraserPos) {
        const radius = getNormalEraserRadius();
        const s = Math.min(124 / viewScale, Math.max(16 / viewScale, radius * 2));
        ctx.save();
        ctx.beginPath();
        ctx.arc(activeTouchEraserPos.x, activeTouchEraserPos.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(220, 220, 220, 0.35)';
        ctx.fill();
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1.5 / viewScale;
        ctx.setLineDash([4 / viewScale, 3 / viewScale]);
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.translate(activeTouchEraserPos.x - s / 2, activeTouchEraserPos.y - s / 2);
        ctx.scale(s / 24, s / 24);
        ctx.fillStyle = '#ddd';
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const bodyPath = new Path2D('M20 20H7L3 16C2 15 2 13 3 12L13 2l9 9-9 9z');
        ctx.fill(bodyPath);
        ctx.stroke(bodyPath);
        ctx.beginPath();
        ctx.moveTo(6, 11);
        ctx.lineTo(12, 17);
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }

    function drawSimplePathOn(targetCtx, points) {
      if (points.length === 1) {
        targetCtx.beginPath();
        targetCtx.arc(points[0].x, points[0].y, targetCtx.lineWidth / 2, 0, Math.PI * 2);
        targetCtx.fillStyle = targetCtx.strokeStyle;
        targetCtx.fill();
        return;
      }
      targetCtx.beginPath(); targetCtx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) targetCtx.lineTo(points[i].x, points[i].y);
      targetCtx.stroke();
    }

    function drawSoftPathOn(targetCtx, points, baseSize, options = {}) {
      const n = points.length;
      if (n === 0) return;
      if (n === 1) {
        const pFactor = points[0].p ? (0.4 + points[0].p * 0.8) : 0.42;
        targetCtx.beginPath();
        targetCtx.arc(points[0].x, points[0].y, Math.max(1, baseSize * pFactor), 0, Math.PI * 2);
        targetCtx.fillStyle = targetCtx.strokeStyle;
        targetCtx.fill();
        return;
      }

      const cumDist = new Array(n).fill(0);
      for (let i = 1; i < n; i++) {
        cumDist[i] = cumDist[i - 1] + Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
      }
      const totalLen = cumDist[n - 1];
      if (totalLen < 0.5) {
        targetCtx.beginPath();
        targetCtx.arc(points[0].x, points[0].y, Math.max(1, baseSize * 0.45), 0, Math.PI * 2);
        targetCtx.fillStyle = targetCtx.strokeStyle;
        targetCtx.fill();
        return;
      }

      const rawWidths = new Array(n);
      const minW = Math.max(1.0, baseSize * 0.24);
      const maxW = Math.max(minW + 0.5, baseSize * 1.65);

      let smoothedSpeed = 6.0;
      let smoothedW = baseSize * 0.85;

      const startTaperLen = options.noStartTaper ? 0 : Math.min(baseSize * 2.2, totalLen * 0.22);
      const endTaperLen = options.noEndTaper ? 0 : Math.min(baseSize * 3.6, totalLen * 0.32);

      for (let i = 0; i < n; i++) {
        if (i > 0) {
          const dist = cumDist[i] - cumDist[i - 1];
          let speed = dist;
          if (points[i].t !== undefined && points[i - 1].t !== undefined) {
            const dt = Math.max(1, points[i].t - points[i - 1].t);
            speed = (dist / dt) * 16.67;
          }
          smoothedSpeed = smoothedSpeed * 0.68 + speed * 0.32;
        }

        const velocityFactor = 1 / (1 + Math.pow(smoothedSpeed / 7.5, 1.35));
        const combinedFactor = (points[i].p !== null && points[i].p !== undefined)
          ? (velocityFactor * 0.45 + Math.min(1, Math.max(0, points[i].p * 1.15)) * 0.55)
          : velocityFactor;

        const targetW = minW + (maxW - minW) * combinedFactor;
        smoothedW = i === 0 ? targetW : (smoothedW * 0.52 + targetW * 0.48);

        const dStart = cumDist[i];
        const dEnd = totalLen - dStart;

        let taper = 1.0;
        if (startTaperLen > 0 && dStart < startTaperLen) {
          const u = dStart / startTaperLen;
          taper *= 0.42 + 0.58 * (1 - Math.pow(1 - u, 2));
        }
        if (endTaperLen > 0 && dEnd < endTaperLen) {
          const u = dEnd / endTaperLen;
          taper *= 0.22 + 0.78 * Math.pow(u, 1.45);
        }

        rawWidths[i] = Math.max(0.8, smoothedW * taper);
      }

      function strokeLinearVar(p0, p1, w0, w1) {
        const segLen = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        const steps = Math.max(1, Math.ceil(segLen / 1.8));
        let prevX = p0.x, prevY = p0.y;
        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          const x = p0.x + (p1.x - p0.x) * t;
          const y = p0.y + (p1.y - p0.y) * t;
          targetCtx.lineWidth = w0 + (w1 - w0) * ((s - 0.5) / steps);
          targetCtx.beginPath();
          targetCtx.moveTo(prevX, prevY);
          targetCtx.lineTo(x, y);
          targetCtx.stroke();
          prevX = x;
          prevY = y;
        }
      }

      function strokeQuadVar(p0, cp, p2, w0, w2) {
        const approxLen = Math.hypot(cp.x - p0.x, cp.y - p0.y) + Math.hypot(p2.x - cp.x, p2.y - cp.y);
        const steps = Math.max(1, Math.ceil(approxLen / 1.8));
        let prevX = p0.x, prevY = p0.y;
        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          const mt = 1 - t;
          const x = mt * mt * p0.x + 2 * mt * t * cp.x + t * t * p2.x;
          const y = mt * mt * p0.y + 2 * mt * t * cp.y + t * t * p2.y;
          targetCtx.lineWidth = w0 + (w2 - w0) * ((s - 0.5) / steps);
          targetCtx.beginPath();
          targetCtx.moveTo(prevX, prevY);
          targetCtx.lineTo(x, y);
          targetCtx.stroke();
          prevX = x;
          prevY = y;
        }
      }

      if (n === 2) {
        strokeLinearVar(points[0], points[1], rawWidths[0], rawWidths[1]);
        return;
      }

      let mid0 = { x: (points[0].x + points[1].x) * 0.5, y: (points[0].y + points[1].y) * 0.5 };
      let midW0 = (rawWidths[0] + rawWidths[1]) * 0.5;
      strokeLinearVar(points[0], mid0, rawWidths[0], midW0);

      for (let i = 1; i < n - 1; i++) {
        const mid1 = { x: (points[i].x + points[i + 1].x) * 0.5, y: (points[i].y + points[i + 1].y) * 0.5 };
        const midW1 = (rawWidths[i] + rawWidths[i + 1]) * 0.5;
        strokeQuadVar(mid0, points[i], mid1, midW0, midW1);
        mid0 = mid1;
        midW0 = midW1;
      }

      strokeLinearVar(mid0, points[n - 1], midW0, rawWidths[n - 1]);
    }

    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return isNaN(num) ? { r: 0, g: 0, b: 0 } : { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function drawSparklePathOn(targetCtx, p, pathOpacity) {
      const time = Date.now() * 0.004;
      const wave = (Math.sin(time * 2.5) + 1) / 2;
      const currentAlpha = (0.2 + wave * 0.8) * pathOpacity;
      const rgb = hexToRgb(p.color);
      const lightFactor = 1 + wave * 0.4;
      const r = Math.min(255, Math.round(rgb.r * lightFactor + wave * 50));
      const g = Math.min(255, Math.round(rgb.g * lightFactor + wave * 50));
      const b = Math.min(255, Math.round(rgb.b * lightFactor + wave * 50));

      targetCtx.save();
      targetCtx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${currentAlpha})`;
      targetCtx.lineWidth = p.size;
      drawSimplePathOn(targetCtx, p.points);
      targetCtx.restore();
    }

    function getRotatedRectAABB(boxObj) {
      const rot = boxObj.rotation || 0;
      if (!rot) {
        return { minX: boxObj.x, minY: boxObj.y, maxX: boxObj.x + boxObj.w, maxY: boxObj.y + boxObj.h };
      }
      const cx = boxObj.x + boxObj.w / 2;
      const cy = boxObj.y + boxObj.h / 2;
      const cos = Math.cos(rot);
      const sin = Math.sin(rot);
      const hw = boxObj.w / 2;
      const hh = boxObj.h / 2;
      const ex = Math.abs(hw * cos) + Math.abs(hh * sin);
      const ey = Math.abs(hw * sin) + Math.abs(hh * cos);
      return {
        minX: cx - ex,
        minY: cy - ey,
        maxX: cx + ex,
        maxY: cy + ey
      };
    }

    function isPointInRotatedRect(px, py, boxObj, pad = 0) {
      const cx = boxObj.x + boxObj.w / 2;
      const cy = boxObj.y + boxObj.h / 2;
      const rot = boxObj.rotation || 0;
      const dx = px - cx;
      const dy = py - cy;
      const cos = Math.cos(-rot);
      const sin = Math.sin(-rot);
      const lx = dx * cos - dy * sin;
      const ly = dx * sin + dy * cos;
      return Math.abs(lx) <= (boxObj.w / 2 + pad) && Math.abs(ly) <= (boxObj.h / 2 + pad);
    }

    function updateGroupBounds() {
      if (selectedPaths.length === 0 && selectedImages.length === 0 && selectedTexts.length === 0) {
        groupBounds = null; topRightMenuWrapper.style.display = 'none'; return;
      }
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      selectedPaths.forEach(p => {
        if (p.rotation) bakePathRotation(p);
        p.points.forEach(pt => {
          if (pt.x < minX) minX = pt.x; if (pt.y < minY) minY = pt.y;
          if (pt.x > maxX) maxX = pt.x; if (pt.y > maxY) maxY = pt.y;
        });
      });
      selectedImages.forEach(img => {
        const box = getRotatedRectAABB(img);
        if (box.minX < minX) minX = box.minX; if (box.minY < minY) minY = box.minY;
        if (box.maxX > maxX) maxX = box.maxX; if (box.maxY > maxY) maxY = box.maxY;
      });
      selectedTexts.forEach(tObj => {
        measureTextObject(tObj);
        const box = getRotatedRectAABB(tObj);
        if (box.minX < minX) minX = box.minX; if (box.minY < minY) minY = box.minY;
        if (box.maxX > maxX) maxX = box.maxX; if (box.maxY > maxY) maxY = box.maxY;
      });
      groupBounds = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    function copySelected() {
      selectedPaths.forEach(p => { if (p.rotation) bakePathRotation(p); });
      clipboard.paths = JSON.parse(JSON.stringify(selectedPaths));
      clipboard.images = selectedImages.map(img => ({
        x: img.x, y: img.y, w: img.w, h: img.h, src: img.src, opacity: img.opacity, rotation: img.rotation || 0
      }));
      clipboard.texts = selectedTexts.map(t => ({
        text: t.text, x: t.x, y: t.y, w: t.w, h: t.h, fontSize: t.fontSize, color: t.color, opacity: t.opacity, rotation: t.rotation || 0
      }));
    }

    function pasteClipboardAt(posX, posY) {
      if (clipboard.paths.length === 0 && clipboard.images.length === 0 && (clipboard.texts || []).length === 0) return;
      const targetPageIdx = currentPageIndex;
      const targetPage = pages[targetPageIdx];
      recordUndoStep(targetPageIdx);
      selectedPaths = []; selectedImages = []; selectedTexts = [];

      let minX = Infinity, minY = Infinity;
      clipboard.paths.forEach(p => p.points.forEach(pt => { if (pt.x < minX) minX = pt.x; if (pt.y < minY) minY = pt.y; }));
      clipboard.images.forEach(img => {
        const box = getRotatedRectAABB(img);
        if (box.minX < minX) minX = box.minX;
        if (box.minY < minY) minY = box.minY;
      });
      (clipboard.texts || []).forEach(t => {
        const box = getRotatedRectAABB(t);
        if (box.minX < minX) minX = box.minX;
        if (box.minY < minY) minY = box.minY;
      });

      const offsetX = (posX !== undefined && minX !== Infinity) ? posX - minX : (40 / viewScale);
      const offsetY = (posY !== undefined && minY !== Infinity) ? posY - minY : (40 / viewScale);

      clipboard.paths.forEach(p => {
        const newP = JSON.parse(JSON.stringify(p));
        newP.points.forEach(pt => { pt.x += offsetX; pt.y += offsetY; });
        targetPage.paths.push(newP);
        selectedPaths.push(newP);
      });

      clipboard.images.forEach(item => {
        const img = getCachedImage(item.src, () => {
          if (currentPageIndex === targetPageIdx) redraw();
        });
        const newImgObj = {
          img: img,
          x: item.x + offsetX,
          y: item.y + offsetY,
          w: item.w,
          h: item.h,
          src: item.src,
          opacity: item.opacity !== undefined ? item.opacity : 1.0,
          rotation: item.rotation || 0
        };
        targetPage.images.push(newImgObj);
        selectedImages.push(newImgObj);
      });

      if (!targetPage.texts) targetPage.texts = [];
      (clipboard.texts || []).forEach(item => {
        const newTextObj = {
          text: item.text,
          x: item.x + offsetX,
          y: item.y + offsetY,
          w: item.w,
          h: item.h,
          fontSize: item.fontSize || 32,
          color: item.color || '#000000',
          opacity: item.opacity !== undefined ? item.opacity : 1.0,
          rotation: item.rotation || 0
        };
        measureTextObject(newTextObj);
        targetPage.texts.push(newTextObj);
        selectedTexts.push(newTextObj);
      });

      paths = targetPage.paths;
      images = targetPage.images;
      texts = targetPage.texts;
      updateGroupBounds();
      prepareTransformBackup();
      updateTextFloatingBarVisibility();
      redraw();
      saveProgress();
    }

    function prepareTransformBackup() {
      selectedPaths.forEach(p => { if (p.rotation) bakePathRotation(p); });
      origGroupBounds = groupBounds ? { x: groupBounds.x, y: groupBounds.y, w: groupBounds.w, h: groupBounds.h } : null;
      selectedImages.forEach(img => {
        img.origX = img.x;
        img.origY = img.y;
        img.origW = img.w;
        img.origH = img.h;
        img.origRotation = img.rotation || 0;
      });
      selectedTexts.forEach(t => {
        measureTextObject(t);
        t.origX = t.x;
        t.origY = t.y;
        t.origW = t.w;
        t.origH = t.h;
        t.origFontSize = t.fontSize || 32;
        t.origRotation = t.rotation || 0;
      });
      selectedPaths.forEach(p => {
        p.origSize = p.size;
        p.origPoints = p.points.map(pt => ({ x: pt.x, y: pt.y, t: pt.t, p: pt.p }));
      });
    }

    function captureFullViewportWhiteboard() {
      const dpr = window.devicePixelRatio || 1;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = Math.round(vw * dpr);
      snapCanvas.height = Math.round(vh * dpr);
      const sctx = snapCanvas.getContext('2d');
      sctx.fillStyle = '#ffffff';
      sctx.fillRect(0, 0, snapCanvas.width, snapCanvas.height);

      const cRect = canvas.getBoundingClientRect();
      sctx.drawImage(
        canvas,
        0, 0, canvas.width, canvas.height,
        cRect.left * dpr, cRect.top * dpr, cRect.width * dpr, cRect.height * dpr
      );

      const toolbarEl = document.getElementById('mainToolbar');
      if (toolbarEl) {
        const tRect = toolbarEl.getBoundingClientRect();
        sctx.fillStyle = '#333333';
        sctx.fillRect(tRect.left * dpr, tRect.top * dpr, tRect.width * dpr, tRect.height * dpr);
      }

      return snapCanvas.toDataURL('image/png');
    }

    function launchSnippingWithImage(dataUrl) {
      capturedScreenImg = new Image();
      capturedScreenImg.onload = () => {
        snipTouchPointers.clear();
        isTwoFingerTapCandidate = false;
        isSnipping = false;
        snipStartX = 0; snipStartY = 0; snipEndX = 0; snipEndY = 0;
        snipCursorX = window.innerWidth / 2;
        snipCursorY = window.innerHeight / 2;
        const dpr = window.devicePixelRatio || 1;
        snippingLayer.width = Math.round(window.innerWidth * dpr);
        snippingLayer.height = Math.round(window.innerHeight * dpr);
        snipCtx.resetTransform();
        snipCtx.scale(dpr, dpr);
        snippingLayer.style.display = 'block';
        renderSnippingOverlay(0, 0, 0, 0);
      };
      capturedScreenImg.src = dataUrl;
    }

    screenshotBtn.addEventListener('click', async () => {
      commitInlineTextEditor(false);
      if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
        try {
          const displayOptions = { video: { cursor: "always" }, audio: false };
          if (typeof CaptureController !== 'undefined') {
            try {
              const controller = new CaptureController();
              if (typeof controller.setFocusBehavior === 'function') {
                controller.setFocusBehavior('no-focus-change');
              }
              displayOptions.controller = controller;
            } catch (ctrlErr) {}
          }
          const stream = await navigator.mediaDevices.getDisplayMedia(displayOptions);
          const video = document.createElement('video');
          video.muted = true;
          video.playsInline = true;
          video.srcObject = stream;
          video.onloadedmetadata = async () => {
            try { await video.play(); } catch (e) {}
            setTimeout(() => {
              const tempCanvas = document.createElement('canvas');
              tempCanvas.width = video.videoWidth; tempCanvas.height = video.videoHeight;
              tempCanvas.getContext('2d').drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
              stream.getTracks().forEach(track => track.stop());
              launchSnippingWithImage(tempCanvas.toDataURL('image/png'));
            }, 250);
          };
          return;
        } catch (err) {
          if (err && (err.name === 'NotAllowedError' || err.name === 'AbortError')) {
            return;
          }
          console.log("外部螢幕擷取未啟用，改用白板局部擷取", err);
        }
      }
      launchSnippingWithImage(captureFullViewportWhiteboard());
    });

    function drawSnipCrosshair(cx, cy) {
      const arm = 22;
      const px = Math.round(cx) + 0.5;
      const py = Math.round(cy) + 0.5;
      snipCtx.save();
      snipCtx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
      snipCtx.lineWidth = 3;
      snipCtx.beginPath();
      snipCtx.moveTo(px - arm, py);
      snipCtx.lineTo(px + arm, py);
      snipCtx.moveTo(px, py - arm);
      snipCtx.lineTo(px, py + arm);
      snipCtx.stroke();

      snipCtx.strokeStyle = '#222222';
      snipCtx.lineWidth = 1;
      snipCtx.beginPath();
      snipCtx.moveTo(px - arm, py);
      snipCtx.lineTo(px + arm, py);
      snipCtx.moveTo(px, py - arm);
      snipCtx.lineTo(px, py + arm);
      snipCtx.stroke();
      snipCtx.restore();
    }

    function renderSnippingOverlay(x1, y1, x2, y2) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      snipCtx.clearRect(0, 0, vw, vh);
      snipCtx.drawImage(capturedScreenImg, 0, 0, vw, vh);
      snipCtx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      snipCtx.fillRect(0, 0, vw, vh);
      if (x1 !== x2 || y1 !== y2) {
        const rx = Math.min(x1, x2), ry = Math.min(y1, y2), rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1);
        snipCtx.save(); snipCtx.beginPath(); snipCtx.rect(rx, ry, rw, rh); snipCtx.clip();
        snipCtx.drawImage(capturedScreenImg, 0, 0, vw, vh);
        snipCtx.restore();
        snipCtx.strokeStyle = '#007bff'; snipCtx.lineWidth = 1.5; snipCtx.strokeRect(rx, ry, rw, rh);
      }
      drawSnipCrosshair(snipCursorX, snipCursorY);
    }

    function captureFullSnip() {
      if (!capturedScreenImg || snippingLayer.style.display === 'none') return;
      isSnipping = false;
      isTwoFingerTapCandidate = false;
      snipTouchPointers.clear();
      snippingLayer.style.display = 'none';

      const fullCanvas = document.createElement('canvas');
      fullCanvas.width = capturedScreenImg.width;
      fullCanvas.height = capturedScreenImg.height;
      fullCanvas.getContext('2d').drawImage(capturedScreenImg, 0, 0);
      const dataUrl = fullCanvas.toDataURL('image/png');

      const cw = canvas.parentElement.clientWidth || window.innerWidth;
      const ch = canvas.parentElement.clientHeight || window.innerHeight;
      const maxW = Math.max(120, cw - 32);
      const maxH = Math.max(120, ch - 32);
      const scale = Math.min(maxW / capturedScreenImg.width, maxH / capturedScreenImg.height, 1);
      const w = (capturedScreenImg.width * scale) / viewScale;
      const h = (capturedScreenImg.height * scale) / viewScale;
      const viewCenter = screenToWorld(cw / 2, ch / 2);
      const x = viewCenter.x - w / 2;
      const y = viewCenter.y - h / 2;

      const newImg = new Image();
      newImg.onload = () => {
        imageCache.set(dataUrl, newImg);
        recordUndoStep();
        images.push({ img: newImg, x: x, y: y, w: w, h: h, src: dataUrl, opacity: 1.0, rotation: 0 });
        pages[currentPageIndex].images = images;
        redraw();
        saveProgress();
      };
      newImg.src = dataUrl;
    }

    function getSnipPoint(e) {
      const sRect = snippingLayer.getBoundingClientRect();
      return {
        x: e.clientX - sRect.left,
        y: e.clientY - sRect.top
      };
    }

    snippingLayer.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      captureFullSnip();
    });

    snippingLayer.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length >= 2) {
        e.preventDefault();
      }
    }, { passive: false });

    snippingLayer.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (e.button === 2) {
        captureFullSnip();
        return;
      }

      const pt = getSnipPoint(e);
      snipCursorX = pt.x;
      snipCursorY = pt.y;

      if (e.pointerType === 'touch') {
        snipTouchPointers.set(e.pointerId, { x: pt.x, y: pt.y });
        if (snipTouchPointers.size === 2) {
          isSnipping = false;
          isTwoFingerTapCandidate = true;
          renderSnippingOverlay(0, 0, 0, 0);
          return;
        }
        if (snipTouchPointers.size > 2) {
          isTwoFingerTapCandidate = false;
          return;
        }
      }

      try { snippingLayer.setPointerCapture(e.pointerId); } catch (err) {}
      isSnipping = true;
      snipStartX = pt.x;
      snipStartY = pt.y;
      snipEndX = snipStartX;
      snipEndY = snipStartY;
      renderSnippingOverlay(snipStartX, snipStartY, snipEndX, snipEndY);
    });

    snippingLayer.addEventListener('pointermove', (e) => {
      const pt = getSnipPoint(e);
      snipCursorX = pt.x;
      snipCursorY = pt.y;

      if (e.pointerType === 'touch' && snipTouchPointers.has(e.pointerId)) {
        const startPt = snipTouchPointers.get(e.pointerId);
        if (isTwoFingerTapCandidate && Math.hypot(pt.x - startPt.x, pt.y - startPt.y) > 25) {
          isTwoFingerTapCandidate = false;
        }
      }

      if (!isSnipping || isTwoFingerTapCandidate) {
        renderSnippingOverlay(0, 0, 0, 0);
        return;
      }

      e.preventDefault();
      snipEndX = pt.x;
      snipEndY = pt.y;
      renderSnippingOverlay(snipStartX, snipStartY, snipEndX, snipEndY);
    });

    function endSnip(e) {
      if (e.pointerType === 'touch') {
        snipTouchPointers.delete(e.pointerId);
        if (isTwoFingerTapCandidate) {
          if (snipTouchPointers.size === 0) {
            captureFullSnip();
          }
          return;
        }
      }

      if (!isSnipping) return;
      isSnipping = false;
      snippingLayer.style.display = 'none';
      const rx = Math.min(snipStartX, snipEndX), ry = Math.min(snipStartY, snipEndY);
      const rw = Math.abs(snipEndX - snipStartX), rh = Math.abs(snipEndY - snipStartY);
      if (rw > 4 && rh > 4) {
        const dpr = window.devicePixelRatio || 1;
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = Math.round(rw * dpr);
        cropCanvas.height = Math.round(rh * dpr);
        const scaleX = capturedScreenImg.width / window.innerWidth;
        const scaleY = capturedScreenImg.height / window.innerHeight;
        cropCanvas.getContext('2d').drawImage(
          capturedScreenImg,
          rx * scaleX, ry * scaleY, rw * scaleX, rh * scaleY,
          0, 0, cropCanvas.width, cropCanvas.height
        );
        const dataUrl = cropCanvas.toDataURL('image/png');
        const rect = canvas.getBoundingClientRect();
        const wp = screenToWorld(rx - rect.left, ry - rect.top);
        const worldW = rw / viewScale;
        const worldH = rh / viewScale;

        const newImg = new Image();
        newImg.onload = () => {
          imageCache.set(dataUrl, newImg);
          recordUndoStep();
          images.push({ img: newImg, x: wp.x, y: wp.y, w: worldW, h: worldH, src: dataUrl, opacity: 1.0, rotation: 0 });
          pages[currentPageIndex].images = images; redraw(); saveProgress();
        };
        newImg.src = dataUrl;
      }
    }

    snippingLayer.addEventListener('pointerup', endSnip);
    snippingLayer.addEventListener('pointercancel', endSnip);

    function getNormalEraserRadius() {

        const s = Math.min(124, Math.max(16, diameter));
        const half = Math.round(s / 2);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="%23ddd" stroke="%23333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2l9 9-9 9z"/><path d="M6 11l6 6"/></svg>`;
        canvas.className = '';
        canvas.style.cursor = `url('data:image/svg+xml;utf8,${svg}') ${half} ${half}, auto`;
      } else if (currentTool === 'eraser') {
        canvas.style.cursor = '';
        canvas.className = 'eraser-cursor';
      }
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;

      if (lenSq < 1e-10) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));

    function segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
      const ccw = (p1x, p1y, p2x, p2y, p3x, p3y) =>
        (p3y - p1y) * (p2x - p1x) > (p2y - p1y) * (p3x - p1x);
      const d1 = ccw(ax, ay, cx, cy, dx, dy);
      const d2 = ccw(bx, by, cx, cy, dx, dy);
      const d3 = ccw(ax, ay, bx, by, cx, cy);
      const d4 = ccw(ax, ay, bx, by, dx, dy);
      if (d1 !== d2 && d3 !== d4) return true;
      return (
        distToSegment(ax, ay, cx, cy, dx, dy) < 1e-6 ||
        distToSegment(bx, by, cx, cy, dx, dy) < 1e-6 ||
        distToSegment(cx, cy, ax, ay, bx, by) < 1e-6 ||
        distToSegment(dx, dy, ax, ay, bx, by) < 1e-6
      );
    }

    function segmentIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
      const rx2 = rx + rw;
      const ry2 = ry + rh;
      if ((x1 >= rx && x1 <= rx2 && y1 >= ry && y1 <= ry2) ||
          (x2 >= rx && x2 <= rx2 && y2 >= ry && y2 <= ry2)) {
        return true;
      }
      return (
        segmentsIntersect(x1, y1, x2, y2, rx, ry, rx2, ry) ||
        segmentsIntersect(x1, y1, x2, y2, rx2, ry, rx2, ry2) ||
        segmentsIntersect(x1, y1, x2, y2, rx2, ry2, rx, ry2) ||
        segmentsIntersect(x1, y1, x2, y2, rx, ry2, rx, ry)
      );
    }

    function hitTestTextObject(pos) {
      for (let i = (texts || []).length - 1; i >= 0; i--) {

      }

    function hitTestObject(pos) {
      const hitRadius = 18 / viewScale;
      for (let i = paths.length - 1; i >= 0; i--) {
        const p = paths[i];
        if (!p.points || p.points.length === 0) continue;

        const strokeHalfW = (p.type === 'highlighter' ? p.size * 2.5 : p.size) * 0.5;
        const threshold = Math.max(hitRadius, strokeHalfW);
        if (p.points.length === 1) {
          if (Math.hypot(p.points[0].x - pos.x, p.points[0].y - pos.y) <= threshold) {

    function intersectSegmentCircle(ax, ay, dx, dy, cx, cy, r) {
      const fx = ax - cx;
      const fy = ay - cy;
      const a = dx * dx + dy * dy;
      if (a < 1e-10) {
        return (fx * fx + fy * fy <= r * r) ? [0, 1] : null;
      }
      const b = 2 * (fx * dx + fy * dy);
      const c = fx * fx + fy * fy - r * r;
      const disc = b * b - 4 * a * c;
      if (disc < 0) return null;
      const sqrtDisc = Math.sqrt(disc);
      const t1 = (-b - sqrtDisc) / (2 * a);
      const t2 = (-b + sqrtDisc) / (2 * a);
      const enter = Math.max(0, t1);
      const exit = Math.min(1, t2);
      return enter <= exit ? [enter, exit] : null;
    }

    function intersectSegmentCapsule(ax, ay, bx, by, e1x, e1y, e2x, e2y, r) {
      const dx = bx - ax;
      const dy = by - ay;
      let enter = Infinity;
      let exit = -Infinity;
      let hit = false;

      const c1 = intersectSegmentCircle(ax, ay, dx, dy, e1x, e1y, r);
      if (c1) {
        enter = Math.min(enter, c1[0]);
        exit = Math.max(exit, c1[1]);
        hit = true;
      }

      const ux = e2x - e1x;
      const uy = e2y - e1y;
      const lenSq = ux * ux + uy * uy;

      if (lenSq > 1e-8) {
        const c2 = intersectSegmentCircle(ax, ay, dx, dy, e2x, e2y, r);
        if (c2) {
          enter = Math.min(enter, c2[0]);
          exit = Math.max(exit, c2[1]);
          hit = true;
        }

        const len = Math.sqrt(lenSq);
        const invLen = 1 / len;
        const tx = ux * invLen;
        const ty = uy * invLen;
        const nx = -ty;
        const ny = tx;

        const relX = ax - e1x;
        const relY = ay - e1y;

        const s0 = relX * tx + relY * ty;
        const ds = dx * tx + dy * ty;
        const n0 = relX * nx + relY * ny;
        const dn = dx * nx + dy * ny;

        let tMin = 0;
        let tMax = 1;
        let rectValid = true;

        if (Math.abs(ds) < 1e-10) {
          if (s0 < 0 || s0 > len) rectValid = false;
        } else {
          let ta = -s0 / ds;
          let tb = (len - s0) / ds;
          if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
          tMin = Math.max(tMin, ta);
          tMax = Math.min(tMax, tb);
          if (tMin > tMax) rectValid = false;
        }

        if (rectValid) {
          if (Math.abs(dn) < 1e-10) {
            if (n0 < -r || n0 > r) rectValid = false;
          } else {
            let ta = (-r - n0) / dn;
            let tb = (r - n0) / dn;
            if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
            tMin = Math.max(tMin, ta);
            tMax = Math.min(tMax, tb);
            if (tMin > tMax) rectValid = false;
          }
        }

        if (rectValid) {
          enter = Math.min(enter, tMin);
          exit = Math.max(exit, tMax);
          hit = true;
        }

          if (pt.y > pMaxY) pMaxY = pt.y;

          }

        } else {

            newPaths.push(p);
            continue;
          }
        }

        if (p.points.length === 1) {
          const pt = p.points[0];
          const hit = intersectSegmentCapsule(pt.x, pt.y, pt.x, pt.y, pos1.x, pos1.y, pos2.x, pos2.y, effectiveRadius);
          if (hit) {

          } else {

        let segStartCut = !!p.noStartTaper;
        let pathModified = false;

        const flushSegment = (endCut) => {

              type: p.type,
              color: p.color,
              size: p.size,
              opacity: p.opacity,
              rotation: 0,
              noStartTaper: segStartCut,
              noEndTaper: endCut,
              points: currentSegment

          const a = p.points[i];
          const b = p.points[i + 1];

          if (!hit) {
            pushPointDedup(currentSegment, { x: a.x, y: a.y, t: a.t, p: a.p });
            pushPointDedup(currentSegment, { x: b.x, y: b.y, t: b.t, p: b.p });

            pathModified = true;
            changed = true;
            const [tEnter, tExit] = hit;
            if (tEnter > 1e-4) {
              pushPointDedup(currentSegment, { x: a.x, y: a.y, t: a.t, p: a.p });
              pushPointDedup(currentSegment, interpolateStrokePoint(a, b, tEnter));
            }
            flushSegment(true);
            segStartCut = true;
            if (tExit < 1 - 1e-4) {
              pushPointDedup(currentSegment, interpolateStrokePoint(a, b, tExit));
              pushPointDedup(currentSegment, { x: b.x, y: b.y, t: b.t, p: b.p });
            }
          }
        }

        if (!pathModified) {
          newPaths.push(p);
        } else {
          flushSegment(!!p.noEndTaper);
        }
      }

      if (changed) {
        paths = newPaths;
        pages[currentPageIndex].paths = paths;
        scheduleRedraw();
      }
    }

      texts = (texts || []).filter(t => {
        measureTextObject(t);
        return !isPointInRotatedRect(pos.x, pos.y, t, 4 / viewScale);
      });
      if (texts.length !== textCount) changed = true;

      const imgCount = images.length;
      images = images.filter(img => !isPointInRotatedRect(pos.x, pos.y, img, 0));
      if (images.length !== imgCount) changed = true;

      if (changed) {
        pages[currentPageIndex].paths = paths;
        pages[currentPageIndex].images = images;
        pages[currentPageIndex].texts = texts;
        scheduleRedraw();
      }
    }

    function isPointInPolygon(point, polygon) {
      let x = point.x, y = point.y, inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        let xi = polygon[i].x, yi = polygon[i].y, xj = polygon[j].x, yj = polygon[j].y;
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }

    clearBtn.addEventListener('click', () => {
      commitInlineTextEditor(false);
      if (paths.length > 0 || images.length > 0 || (texts || []).length > 0) {
        recordUndoStep();
      }
      pages[currentPageIndex].paths = [];
      pages[currentPageIndex].images = [];
      pages[currentPageIndex].texts = [];
      paths = pages[currentPageIndex].paths;
      images = pages[currentPageIndex].images;
      texts = pages[currentPageIndex].texts;
      selectedPaths = []; selectedImages = []; selectedTexts = []; groupBounds = null; origGroupBounds = null;
      topRightMenuWrapper.style.display = 'none'; objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show'); canvasMenu.style.display = 'none';
      updateTextFloatingBarVisibility();
      resetViewTransform();
      redraw(); saveProgress();
    });

    function computeInfiniteContentBounds() {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

      function expandRotatedRect(x, y, w, h, rot, pad = 0) {
        const cx = x + w / 2;
        const cy = y + h / 2;
        const cos = rot ? Math.cos(rot) : 1;
        const sin = rot ? Math.sin(rot) : 0;
        const corners = [
          { x: x, y: y },
          { x: x + w, y: y },
          { x: x + w, y: y + h },
          { x: x, y: y + h }
        ];
        corners.forEach(c => {
          const rx = cx + (c.x - cx) * cos - (c.y - cy) * sin;
          const ry = cy + (c.x - cx) * sin + (c.y - cy) * cos;
          if (rx - pad < minX) minX = rx - pad;
          if (ry - pad < minY) minY = ry - pad;
          if (rx + pad > maxX) maxX = rx + pad;
          if (ry + pad > maxY) maxY = ry + pad;
        });
      }

      images.forEach(imgObj => {
        expandRotatedRect(imgObj.x, imgObj.y, imgObj.w, imgObj.h, imgObj.rotation || 0, 0);
      });

      (texts || []).forEach(tObj => {
        measureTextObject(tObj);
        expandRotatedRect(tObj.x, tObj.y, tObj.w, tObj.h, tObj.rotation || 0, 4);
      });

      paths.forEach(p => {
        if (!p.points || p.points.length === 0) return;
        let pMinX = Infinity, pMinY = Infinity, pMaxX = -Infinity, pMaxY = -Infinity;
        p.points.forEach(pt => {
          if (pt.x < pMinX) pMinX = pt.x;
          if (pt.y < pMinY) pMinY = pt.y;
          if (pt.x > pMaxX) pMaxX = pt.x;
          if (pt.y > pMaxY) pMaxY = pt.y;
        });
        const pad = p.type === 'highlighter' ? p.size * 1.5 : p.size;
        expandRotatedRect(pMinX, pMinY, pMaxX - pMinX, pMaxY - pMinY, p.rotation || 0, pad);
      });

      if (minX === Infinity) return null;
      const margin = 40;
      return {
        x: Math.floor(minX - margin),
        y: Math.floor(minY - margin),
        w: Math.max(100, Math.ceil(maxX - minX + margin * 2)),
        h: Math.max(100, Math.ceil(maxY - minY + margin * 2))
      };
    }

    function saveDrawingFile() {
      commitInlineTextEditor(false);
      if (paths.length === 0 && images.length === 0 && (texts || []).length === 0) return;
      let fileName = prompt(`請輸入「第 ${currentPageIndex + 1} 頁」的檔案名稱：`, `數位白板_第${currentPageIndex + 1}頁`);
      if (fileName !== null) {
        fileName = fileName.trim() === "" ? `drawing_page_${currentPageIndex + 1}` : fileName.trim();
        const bounds = computeInfiniteContentBounds();
        if (!bounds) return;

        const dpr = window.devicePixelRatio || 1;
        const exportScale = Math.min(dpr, 4096 / bounds.w, 4096 / bounds.h);
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = Math.max(1, Math.round(bounds.w * exportScale));
        exportCanvas.height = Math.max(1, Math.round(bounds.h * exportScale));
        const exportCtx = exportCanvas.getContext('2d');

        exportCtx.fillStyle = '#ffffff';
        exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

        exportCtx.scale(exportScale, exportScale);
        exportCtx.translate(-bounds.x, -bounds.y);
        renderPageContent(exportCtx);

        const link = document.createElement('a');
        link.download = fileName + '.png';
        link.href = exportCanvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    saveBtn.addEventListener('click', () => saveDrawingFile());

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && !isLoggingOut) {
        saveProgress();
      }
    });
    window.addEventListener('pagehide', () => {
      if (!isLoggingOut) saveProgress();
    });
    window.addEventListener('beforeunload', () => {
      if (!isLoggingOut) saveProgress();
    });
  </script>
</body>
</html>
