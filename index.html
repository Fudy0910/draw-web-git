      btn.addEventListener('click', (e) => {
        e.stopPropagation(); const val = btn.getAttribute('data-size');
        sizeRange.value = val; updateSizeUI(val);
      });
    });

    function screenToWorld(sx, sy) {
      return {
        x: (sx - viewOffsetX) / viewScale,
        y: (sy - viewOffsetY) / viewScale
      };
    }

    function getScreenPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
        p: (e.pointerType === 'pen' && typeof e.pressure === 'number' && e.pressure > 0) ? e.pressure : null
      };
    }

    function getPointerPos(e) {
      const sp = getScreenPos(e);
      const wp = screenToWorld(sp.x, sp.y);
      return { x: wp.x, y: wp.y, p: sp.p };
    }

    function applyZoomAtScreenPoint(sx, sy, mode, customScale = null) {
      const wp = screenToWorld(sx, sy);
      let nextScale = customScale !== null
        ? customScale
        : (mode === 'in' ? (viewScale * 1.25) : (viewScale / 1.25));
      nextScale = Math.min(10.0, Math.max(0.1, nextScale));
      if (customScale === null && Math.abs(nextScale - 1.0) < 0.04) nextScale = 1.0;

      viewScale = nextScale;
      viewOffsetX = sx - wp.x * viewScale;
      viewOffsetY = sy - wp.y * viewScale;
      syncPageViewState();
      if (currentTool === 'eraser') updateEraserCursor();
      redraw();
    }

    canvas.addEventListener('wheel', (e) => {
      if (loginOverlay.style.display !== 'none' || bootScreen.style.display !== 'none') return;
      if (currentTool === 'zoom' || e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const factor = Math.exp(-e.deltaY * 0.002);
        applyZoomAtScreenPoint(sx, sy, null, viewScale * factor);
      }
    }, { passive: false });

    function hitTestObject(pos) {
      const hitRadius = 18 / viewScale;
      for (let i = paths.length - 1; i >= 0; i--) {
        const p = paths[i];
        if (p.points.some(pt => Math.hypot(pt.x - pos.x, pt.y - pos.y) <= Math.max(hitRadius, p.size))) return { type: 'path', obj: p };
      }
      for (let i = images.length - 1; i >= 0; i--) {
        const img = images[i];
        if (pos.x >= img.x && pos.x <= img.x + img.w && pos.y >= img.y && pos.y <= img.y + img.h) return { type: 'image', obj: img };
      }
      return null;
    }

    function hitTestHandle(pos) {
      if (!groupBounds) return null;
      const invS = 1 / viewScale;
      const rotX = groupBounds.x + groupBounds.w / 2, rotY = groupBounds.y - 26 * invS;
      if (Math.hypot(pos.x - rotX, pos.y - rotY) < 18 * invS) return 'rotating';

      const swX = groupBounds.x, swY = groupBounds.y + groupBounds.h;
      if (Math.hypot(pos.x - swX, pos.y - swY) < 20 * invS) return 'resizing-sw';

      const nX = groupBounds.x + groupBounds.w / 2, nY = groupBounds.y;
      if (Math.hypot(pos.x - nX, pos.y - nY) < 18 * invS) return 'resizing-n';

      const sX = groupBounds.x + groupBounds.w / 2, sY = groupBounds.y + groupBounds.h;
      if (Math.hypot(pos.x - sX, pos.y - sY) < 18 * invS) return 'resizing-s';

      const wX = groupBounds.x, wY = groupBounds.y + groupBounds.h / 2;
      if (Math.hypot(pos.x - wX, pos.y - wY) < 18 * invS) return 'resizing-w';

      const eX = groupBounds.x + groupBounds.w, eY = groupBounds.y + groupBounds.h / 2;
      if (Math.hypot(pos.x - eX, pos.y - eY) < 18 * invS) return 'resizing-e';

      return null;
    }

    function updateSelectCursor(pos) {
      if (currentTool !== 'select' || interactionState) return;
      if (groupBounds) {
        const handle = hitTestHandle(pos);
        if (handle === 'rotating') { canvas.style.cursor = 'grab'; return; }
        if (handle === 'resizing-sw') { canvas.style.cursor = 'nesw-resize'; return; }
        if (handle === 'resizing-n' || handle === 'resizing-s') { canvas.style.cursor = 'ns-resize'; return; }
        if (handle === 'resizing-w' || handle === 'resizing-e') { canvas.style.cursor = 'ew-resize'; return; }
        if (pos.x >= groupBounds.x && pos.x <= groupBounds.x + groupBounds.w && pos.y >= groupBounds.y && pos.y <= groupBounds.y + groupBounds.h) {
          canvas.style.cursor = 'move';
          return;
        }
      }
      canvas.style.cursor = 'default';
    }

    function beginCanvasPan(sp) {
      isPanning = true;
      panMoved = false;
      panStartX = sp.x;
      panStartY = sp.y;
      panOrigOffsetX = viewOffsetX;
      panOrigOffsetY = viewOffsetY;
    }

    function startAction(e) {
      const sp = getScreenPos(e);

      if (currentTool === 'zoom' || spaceKeyPressed || e.button === 1) {
        beginCanvasPan(sp);
        if (spaceKeyPressed || e.button === 1) {
          canvas.style.cursor = 'grabbing';
        }
        return;
      }

      const pos = getPointerPos(e);
      if (currentTool === 'select') {
        if (groupBounds) {
          const handle = hitTestHandle(pos);
          if (handle) {
            pendingHistorySnapshot = capturePageState();
            interactionState = handle;
            dragStartX = pos.x; dragStartY = pos.y;
            prepareTransformBackup();
            if (handle === 'rotating') canvas.style.cursor = 'grabbing';
            else if (handle === 'resizing-sw') canvas.style.cursor = 'nesw-resize';
            else if (handle === 'resizing-n' || handle === 'resizing-s') canvas.style.cursor = 'ns-resize';
            else if (handle === 'resizing-w' || handle === 'resizing-e') canvas.style.cursor = 'ew-resize';
            objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show');
            return;
          }
          if (pos.x >= groupBounds.x && pos.x <= groupBounds.x + groupBounds.w && pos.y >= groupBounds.y && pos.y <= groupBounds.y + groupBounds.h) {
            pendingHistorySnapshot = capturePageState();
            interactionState = 'dragging';
            dragStartX = pos.x; dragStartY = pos.y;
            prepareTransformBackup();
            canvas.style.cursor = 'move';
            objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show');
            return;
          }
        }
        const hit = hitTestObject(pos);
        if (hit) {
          pendingHistorySnapshot = capturePageState();
          selectedPaths = hit.type === 'path' ? [hit.obj] : [];
          selectedImages = hit.type === 'image' ? [hit.obj] : [];
          updateGroupBounds(); prepareTransformBackup(); interactionState = 'dragging';
          dragStartX = pos.x; dragStartY = pos.y;
          canvas.style.cursor = 'move';
          objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show'); redraw(); return;
        }
        isSelecting = true; selectStartX = pos.x; selectStartY = pos.y;
        selectionBox = { x: pos.x, y: pos.y, w: 0, h: 0 };
        selectedPaths = []; selectedImages = []; groupBounds = null; origGroupBounds = null;
        objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show'); redraw();
      } else {
        isDrawing = true;
        pendingHistorySnapshot = capturePageState();
        if (currentTool === 'pen') {
          const stampedPos = { x: pos.x, y: pos.y, t: performance.now(), p: pos.p };
          currentPath = { type: penType, color: currentColor, size: parseInt(sizeRange.value), points: [stampedPos], opacity: 1.0, rotation: 0 };
          paths.push(currentPath); pages[currentPageIndex].paths = paths; scheduleRedraw();
        } else if (currentTool === 'eraser' && eraserType === 'lasso') { lassoPoints = [pos]; scheduleRedraw(); }
        else if (currentTool === 'eraser' && eraserType === 'object') { eraseObjectAt(pos); }
        else if (currentTool === 'eraser' && eraserType === 'normal') {
          if (e.pointerType !== 'mouse') {
            activeTouchEraserPos = pos;
            scheduleRedraw();
          }
          lastEraserPos = pos;
          eraseAlongSegment(pos, pos);
        }
      }
    }

    let lastEraserPos = null;
    function moveAction(e) {
      const sp = getScreenPos(e);

      if (isPanning) {
        const dx = sp.x - panStartX;
        const dy = sp.y - panStartY;
        if (!panMoved && Math.hypot(dx, dy) > 5) {
          panMoved = true;
          canvas.style.cursor = 'grabbing';
        }
        if (panMoved) {
          viewOffsetX = panOrigOffsetX + dx;
          viewOffsetY = panOrigOffsetY + dy;
          syncPageViewState();
          scheduleRedraw();
        }
        return;
      }

      if (currentTool === 'zoom') return;
      const pos = getPointerPos(e);
      if (currentTool === 'select') {
        if (interactionState === 'dragging') {
          const dx = pos.x - dragStartX, dy = pos.y - dragStartY;
          dragStartX = pos.x; dragStartY = pos.y;
          selectedPaths.forEach(p => p.points.forEach(pt => { pt.x += dx; pt.y += dy; }));
          selectedImages.forEach(img => { img.x += dx; img.y += dy; });
          updateGroupBounds(); pages[currentPageIndex].paths = paths; pages[currentPageIndex].images = images;
          scheduleRedraw();
        } else if (interactionState === 'resizing-sw' && origGroupBounds) {
          const origRight = origGroupBounds.x + origGroupBounds.w;
          const origTop = origGroupBounds.y;
          const origW = origGroupBounds.w;
          const origH = origGroupBounds.h;
          const newW = Math.max(20, origRight - pos.x);
          const newH = Math.max(20, pos.y - origTop);

          let avgScale = 1;
          if (origW < 2 && origH < 2) avgScale = 1;
          else if (origW < 2) avgScale = newH / origH;
          else if (origH < 2) avgScale = newW / origW;
          else avgScale = ((newW / origW) + (newH / origH)) / 2;

          selectedImages.forEach(img => {
            img.x = origRight + (img.origX - origRight) * avgScale;
            img.y = origTop + (img.origY - origTop) * avgScale;
            img.w = Math.max(10, img.origW * avgScale);
            img.h = Math.max(10, img.origH * avgScale);
          });
          selectedPaths.forEach(p => {
            if (p.origSize !== undefined) p.size = Math.max(1, p.origSize * avgScale);
            p.points.forEach((pt, idx) => {
              const origPt = p.origPoints[idx];
              pt.x = origRight + (origPt.x - origRight) * avgScale;
              pt.y = origTop + (origPt.y - origTop) * avgScale;
            });
          });
          updateGroupBounds();
          pages[currentPageIndex].paths = paths; pages[currentPageIndex].images = images;
          scheduleRedraw();
        } else if (interactionState === 'resizing-e' && origGroupBounds) {
          const origLeft = origGroupBounds.x;
          const origW = origGroupBounds.w;
          const newW = Math.max(10, pos.x - origLeft);
          const scaleX = origW < 2 ? 1 : newW / origW;

          selectedImages.forEach(img => {
            img.x = origLeft + (img.origX - origLeft) * scaleX;
            img.w = Math.max(5, img.origW * scaleX);
          });
          selectedPaths.forEach(p => {
            p.points.forEach((pt, idx) => {
              const origPt = p.origPoints[idx];
              pt.x = origLeft + (origPt.x - origLeft) * scaleX;
              pt.y = origPt.y;
            });
          });
          updateGroupBounds();
          pages[currentPageIndex].paths = paths; pages[currentPageIndex].images = images;
          scheduleRedraw();
        } else if (interactionState === 'resizing-w' && origGroupBounds) {
          const origRight = origGroupBounds.x + origGroupBounds.w;
          const origW = origGroupBounds.w;
          const newW = Math.max(10, origRight - pos.x);
          const scaleX = origW < 2 ? 1 : newW / origW;

          selectedImages.forEach(img => {
            img.x = origRight + (img.origX - origRight) * scaleX;
            img.w = Math.max(5, img.origW * scaleX);
          });
          selectedPaths.forEach(p => {
            p.points.forEach((pt, idx) => {
              const origPt = p.origPoints[idx];
              pt.x = origRight + (origPt.x - origRight) * scaleX;
              pt.y = origPt.y;
            });
          });
          updateGroupBounds();
          pages[currentPageIndex].paths = paths; pages[currentPageIndex].images = images;
          scheduleRedraw();
        } else if (interactionState === 'resizing-s' && origGroupBounds) {
          const origTop = origGroupBounds.y;
          const origH = origGroupBounds.h;
          const newH = Math.max(10, pos.y - origTop);
          const scaleY = origH < 2 ? 1 : newH / origH;

          selectedImages.forEach(img => {
            img.y = origTop + (img.origY - origTop) * scaleY;
            img.h = Math.max(5, img.origH * scaleY);
          });
          selectedPaths.forEach(p => {
            p.points.forEach((pt, idx) => {
              const origPt = p.origPoints[idx];
              pt.x = origPt.x;
              pt.y = origTop + (origPt.y - origTop) * scaleY;
            });
          });
          updateGroupBounds();
          pages[currentPageIndex].paths = paths; pages[currentPageIndex].images = images;
          scheduleRedraw();
        } else if (interactionState === 'resizing-n' && origGroupBounds) {
          const origBottom = origGroupBounds.y + origGroupBounds.h;
          const origH = origGroupBounds.h;
          const newH = Math.max(10, origBottom - pos.y);
          const scaleY = origH < 2 ? 1 : newH / origH;

          selectedImages.forEach(img => {
            img.y = origBottom + (img.origY - origBottom) * scaleY;
            img.h = Math.max(5, img.origH * scaleY);
          });
          selectedPaths.forEach(p => {
            p.points.forEach((pt, idx) => {
              const origPt = p.origPoints[idx];
              pt.x = origPt.x;
              pt.y = origBottom + (origPt.y - origBottom) * scaleY;
            });
          });
          updateGroupBounds();
          pages[currentPageIndex].paths = paths; pages[currentPageIndex].images = images;
          scheduleRedraw();
        } else if (interactionState === 'rotating') {
          const cx = groupBounds.x + groupBounds.w / 2, cy = groupBounds.y + groupBounds.h / 2;
          const angle = Math.atan2(pos.y - cy, pos.x - cx) - Math.atan2(-26 / viewScale, 0);
          selectedImages.forEach(img => img.rotation = angle);
          selectedPaths.forEach(p => p.rotation = angle);
          pages[currentPageIndex].paths = paths; pages[currentPageIndex].images = images;
          scheduleRedraw();
        } else if (isSelecting) {
          selectionBox.w = pos.x - selectStartX; selectionBox.h = pos.y - selectStartY;
          let rx = selectionBox.w < 0 ? selectStartX + selectionBox.w : selectStartX;
          let ry = selectionBox.h < 0 ? selectStartY + selectionBox.h : selectStartY;
          selectionBox = { x: rx, y: ry, w: Math.abs(selectionBox.w), h: Math.abs(selectionBox.h) };
          scheduleRedraw();
        } else {
          updateSelectCursor(pos);
        }
      } else if (isDrawing) {
        if (currentTool === 'pen' && currentPath) {
          const lastPt = currentPath.points[currentPath.points.length - 1];
          if (!lastPt || Math.hypot(pos.x - lastPt.x, pos.y - lastPt.y) >= (1.2 / viewScale)) {
            currentPath.points.push({ x: pos.x, y: pos.y, t: performance.now(), p: pos.p });
            pages[currentPageIndex].paths = paths;
            scheduleRedraw();
          }
        } else if (currentTool === 'eraser' && eraserType === 'normal') {
          const coalesced = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : null;
          if (coalesced && coalesced.length > 0) {
            for (let i = 0; i < coalesced.length; i++) {
              const subPos = getPointerPos(coalesced[i]);
              eraseAlongSegment(lastEraserPos || subPos, subPos);
              lastEraserPos = subPos;
            }
          } else {
            eraseAlongSegment(lastEraserPos || pos, pos);
            lastEraserPos = pos;
          }
          if (e.pointerType !== 'mouse') {
            activeTouchEraserPos = pos;
            scheduleRedraw();
          }
        } else if (currentTool === 'eraser' && eraserType === 'object') { eraseObjectAt(pos); }
        else if (currentTool === 'eraser' && eraserType === 'lasso') { lassoPoints.push(pos); scheduleRedraw(); }
      }
    }

    function endAction(e) {
      if (isPanning) {
        const wasDragged = panMoved;
        isPanning = false;
        panMoved = false;
        restoreDefaultCursorForCurrentTool();
        if (!wasDragged && currentTool === 'zoom' && e) {
          const sp = getScreenPos(e);
          applyZoomAtScreenPoint(sp.x, sp.y, zoomMode);
        }
        saveProgress();
        return;
      }

      lastEraserPos = null;
      if (activeTouchEraserPos) {
        activeTouchEraserPos = null;
        redraw();
      }
      if (currentTool === 'select') {
        if (interactionState) {
          interactionState = null;
          canvas.style.cursor = 'default';
          prepareTransformBackup();
          redraw();
          if (pendingHistorySnapshot && !isSamePageState(pendingHistorySnapshot, capturePageState())) {
            pushHistorySnapshot(pendingHistorySnapshot);
          }
          pendingHistorySnapshot = null;
          saveProgress();
        } else if (isSelecting) {
          isSelecting = false;
          selectedImages = images.filter(img => 
            img.x < selectionBox.x + selectionBox.w && 
            img.x + img.w > selectionBox.x && 
            img.y < selectionBox.y + selectionBox.h && 
            img.y + img.h > selectionBox.y
          );
          selectedPaths = paths.filter(p => 
            p.points.some(pt => 
              pt.x >= selectionBox.x && 
              pt.x <= selectionBox.x + selectionBox.w && 
              pt.y >= selectionBox.y && 
              pt.y <= selectionBox.y + selectionBox.h
            )
          );
          updateGroupBounds(); selectionBox = null; prepareTransformBackup(); redraw();
        }
      } else if (isDrawing) {
        isDrawing = false;
        if (currentTool === 'eraser' && eraserType === 'lasso' && lassoPoints.length > 2) {
          paths = paths.filter(p => !p.points.some(pt => isPointInPolygon(pt, lassoPoints)));
          pages[currentPageIndex].paths = paths; lassoPoints = []; redraw();
        } else if (currentTool === 'eraser' && eraserType === 'lasso') { lassoPoints = []; redraw(); }
        if (pendingHistorySnapshot && !isSamePageState(pendingHistorySnapshot, capturePageState())) {
          pushHistorySnapshot(pendingHistorySnapshot);
        }
        pendingHistorySnapshot = null;
        currentPath = null;
        saveProgress();
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0 && e.button !== 1 && e.button !== 2) return;
      const sp = getScreenPos(e);

      if (e.pointerType === 'touch') {
        activeCanvasTouches.set(e.pointerId, { x: sp.x, y: sp.y });
        if (activeCanvasTouches.size === 2) {
          clearTimeout(blankLongPressTimer);
          if (isDrawing && pendingHistorySnapshot) {
            restorePageState(pendingHistorySnapshot, currentPageIndex);
            pendingHistorySnapshot = null;
          }
          isDrawing = false;
          currentPath = null;
          lassoPoints = [];
          isSelecting = false;
          selectionBox = null;
          interactionState = null;
          isPanning = false;
          panMoved = false;
          activeTouchEraserPos = null;
          activePointerId = null;

          isTwoFingerGesture = true;
          const pts = Array.from(activeCanvasTouches.values());
          prevTwoFingerDist = Math.max(10, Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y));
          prevTwoFingerMidX = (pts[0].x + pts[1].x) * 0.5;
          prevTwoFingerMidY = (pts[0].y + pts[1].y) * 0.5;
          scheduleRedraw();
          return;
        }
        if (activeCanvasTouches.size > 2 || isTwoFingerGesture) {
          return;
        }
      }

      if (activePointerId !== null && e.pointerType === 'touch') return;
      activePointerId = e.pointerId;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

      const pos = screenToWorld(sp.x, sp.y);
      startPos = sp;

      if (currentTool === 'select' && !groupBounds && !spaceKeyPressed && e.button !== 1) {
        if (e.button === 2) {
          menuOpenPos = pos; canvasMenu.style.display = 'flex';
          canvasMenu.style.left = sp.x + 'px'; canvasMenu.style.top = sp.y + 'px';
          return;
        } else {
          clearTimeout(blankLongPressTimer);
          if (!hitTestObject(pos)) {
            blankLongPressTimer = setTimeout(() => {
              menuOpenPos = pos; canvasMenu.style.display = 'flex';
              canvasMenu.style.left = sp.x + 'px'; canvasMenu.style.top = sp.y + 'px';
            }, 500);
          }
        }
      }
      startAction(e);
    });

    canvas.addEventListener('pointermove', (e) => {
      const sp = getScreenPos(e);

      if (e.pointerType === 'touch' && activeCanvasTouches.has(e.pointerId)) {
        activeCanvasTouches.set(e.pointerId, { x: sp.x, y: sp.y });
        if (isTwoFingerGesture && activeCanvasTouches.size === 2) {
          const pts = Array.from(activeCanvasTouches.values());
          const newDist = Math.max(10, Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y));
          const newMidX = (pts[0].x + pts[1].x) * 0.5;
          const newMidY = (pts[0].y + pts[1].y) * 0.5;

          const worldAtPrevMid = screenToWorld(prevTwoFingerMidX, prevTwoFingerMidY);
          const scaleFactor = newDist / prevTwoFingerDist;
          viewScale = Math.min(10.0, Math.max(0.1, viewScale * scaleFactor));
          viewOffsetX = newMidX - worldAtPrevMid.x * viewScale;
          viewOffsetY = newMidY - worldAtPrevMid.y * viewScale;

          prevTwoFingerDist = newDist;
          prevTwoFingerMidX = newMidX;
          prevTwoFingerMidY = newMidY;
          syncPageViewState();
          if (currentTool === 'eraser') updateEraserCursor();
          scheduleRedraw();
          return;
        }
      }

      if (isTwoFingerGesture) return;
      if (activePointerId !== null && e.pointerId !== activePointerId) return;
      if (Math.hypot(sp.x - startPos.x, sp.y - startPos.y) > 15) clearTimeout(blankLongPressTimer);
      if (isPanning || isDrawing || interactionState || isSelecting || currentTool === 'select') {
        moveAction(e);
      }
    });

    function finishPointer(e) {
      if (e.pointerType === 'touch') {
        activeCanvasTouches.delete(e.pointerId);
        if (isTwoFingerGesture) {
          if (activeCanvasTouches.size === 0) {
            isTwoFingerGesture = false;
            saveProgress();
          }
          return;
        }
      }

      if (activePointerId !== null && e.pointerId !== activePointerId) return;
      clearTimeout(blankLongPressTimer);
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      activePointerId = null;
      endAction(e);
    }

    canvas.addEventListener('pointerup', finishPointer);
    canvas.addEventListener('pointercancel', finishPointer);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && spaceKeyPressed) {
        spaceKeyPressed = false;
        if (!isPanning) restoreDefaultCursorForCurrentTool();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (loginOverlay.style.display !== 'none' || bootScreen.style.display !== 'none') return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        spaceKeyPressed = true;
        if (!isPanning && !isDrawing && !interactionState) {
          canvas.style.cursor = '';
          canvas.className = 'pan-grab-cursor';
        }
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        e.preventDefault();
        undoAction();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
        e.preventDefault();
        redoAction();
        return;
      }

      if (currentTool === 'select' && (selectedPaths.length > 0 || selectedImages.length > 0)) {
        if (e.key === 'Delete' || e.key === 'Backspace') {
          recordUndoStep();
          deleteSelected();
          saveProgress();
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') copySelected();
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
          recordUndoStep();
          copySelected();
          deleteSelected();
          saveProgress();
        }
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
        pasteClipboardAt();
        saveProgress();
      }
    });

    function bakePathRotation(p) {
      if (!p.rotation) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      p.points.forEach(pt => {
        if (pt.x < minX) minX = pt.x;
        if (pt.y < minY) minY = pt.y;
        if (pt.x > maxX) maxX = pt.x;
        if (pt.y > maxY) maxY = pt.y;
      });
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const cos = Math.cos(p.rotation);
      const sin = Math.sin(p.rotation);
      p.points.forEach(pt => {
        const dx = pt.x - cx;
        const dy = pt.y - cy;
        pt.x = cx + dx * cos - dy * sin;
        pt.y = cy + dx * sin + dy * cos;
      });
      p.rotation = 0;
    }

    function intersectSegmentCircle(ax, ay, dx, dy, cx, cy, r) {
      const fx = ax - cx;
      const fy = ay - cy;
      const a = dx * dx + dy * dy;
      if (a < 1e-10) {
        return (fx * fx + fy * fy <= r * r) ? [0, 1] : null;
      }
      const b = 2 * (fx * dx + fy * dy);
      const c = fx * fx + fy * fy - r * r;
      const disc = b * b - 4 * a * c;
      if (disc < 0) return null;
      const sqrtDisc = Math.sqrt(disc);
      const t1 = (-b - sqrtDisc) / (2 * a);
      const t2 = (-b + sqrtDisc) / (2 * a);
      const enter = Math.max(0, t1);
      const exit = Math.min(1, t2);
      return enter <= exit ? [enter, exit] : null;
    }

    function intersectSegmentCapsule(ax, ay, bx, by, e1x, e1y, e2x, e2y, r) {
      const dx = bx - ax;
      const dy = by - ay;
      let enter = Infinity;
      let exit = -Infinity;
      let hit = false;

      const c1 = intersectSegmentCircle(ax, ay, dx, dy, e1x, e1y, r);
      if (c1) {
        enter = Math.min(enter, c1[0]);
        exit = Math.max(exit, c1[1]);
        hit = true;
      }

      const ux = e2x - e1x;
      const uy = e2y - e1y;
      const lenSq = ux * ux + uy * uy;

      if (lenSq > 1e-8) {
        const c2 = intersectSegmentCircle(ax, ay, dx, dy, e2x, e2y, r);
        if (c2) {
          enter = Math.min(enter, c2[0]);
          exit = Math.max(exit, c2[1]);
          hit = true;
        }

        const len = Math.sqrt(lenSq);
        const invLen = 1 / len;
        const tx = ux * invLen;
        const ty = uy * invLen;
        const nx = -ty;
        const ny = tx;

        const relX = ax - e1x;
        const relY = ay - e1y;

        const s0 = relX * tx + relY * ty;
        const ds = dx * tx + dy * ty;
        const n0 = relX * nx + relY * ny;
        const dn = dx * nx + dy * ny;

        let tMin = 0;
        let tMax = 1;
        let rectValid = true;

        if (Math.abs(ds) < 1e-10) {
          if (s0 < 0 || s0 > len) rectValid = false;
        } else {
          let ta = -s0 / ds;
          let tb = (len - s0) / ds;
          if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
          tMin = Math.max(tMin, ta);
          tMax = Math.min(tMax, tb);
          if (tMin > tMax) rectValid = false;
        }

        if (rectValid) {
          if (Math.abs(dn) < 1e-10) {
            if (n0 < -r || n0 > r) rectValid = false;
          } else {
            let ta = (-r - n0) / dn;
            let tb = (r - n0) / dn;
            if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
            tMin = Math.max(tMin, ta);
            tMax = Math.min(tMax, tb);
            if (tMin > tMax) rectValid = false;
          }
        }

        if (rectValid) {
          enter = Math.min(enter, tMin);
          exit = Math.max(exit, tMax);
          hit = true;
        }
      }

      return hit ? [enter, exit] : null;
    }

    function interpolateStrokePoint(a, b, t) {
      if (t <= 1e-4) return { x: a.x, y: a.y, t: a.t, p: a.p };
      if (t >= 1 - 1e-4) return { x: b.x, y: b.y, t: b.t, p: b.p };
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t,
        t: (a.t !== undefined && b.t !== undefined) ? a.t + (b.t - a.t) * t : a.t,
        p: (a.p !== null && a.p !== undefined && b.p !== null && b.p !== undefined) ? a.p + (b.p - a.p) * t : a.p
      };
    }

    function pushPointDedup(seg, pt) {
      if (seg.length === 0) {
        seg.push(pt);
        return;
      }
      const prev = seg[seg.length - 1];
      if (Math.hypot(pt.x - prev.x, pt.y - prev.y) > 0.05) {
        seg.push(pt);
      }
    }

    function eraseAlongSegment(pos1, pos2) {
      const radius = getNormalEraserRadius();
      const capMinX = Math.min(pos1.x, pos2.x) - radius;
      const capMaxX = Math.max(pos1.x, pos2.x) + radius;
      const capMinY = Math.min(pos1.y, pos2.y) - radius;
      const capMaxY = Math.max(pos1.y, pos2.y) + radius;

      const newPaths = [];
      let changed = false;

      for (let idx = 0; idx < paths.length; idx++) {
        const p = paths[idx];
        if (!p.points || p.points.length === 0) continue;

        let pMinX = Infinity, pMinY = Infinity, pMaxX = -Infinity, pMaxY = -Infinity;
        for (let k = 0; k < p.points.length; k++) {
          const pt = p.points[k];
          if (pt.x < pMinX) pMinX = pt.x;
          if (pt.y < pMinY) pMinY = pt.y;
          if (pt.x > pMaxX) pMaxX = pt.x;
          if (pt.y > pMaxY) pMaxY = pt.y;
        }

        if (p.rotation) {
          const cx = (pMinX + pMaxX) / 2;
          const cy = (pMinY + pMaxY) / 2;
          const halfDiag = Math.hypot(pMaxX - pMinX, pMaxY - pMinY) / 2;
          if (cx + halfDiag < capMinX || cx - halfDiag > capMaxX || cy + halfDiag < capMinY || cy - halfDiag > capMaxY) {
            newPaths.push(p);
            continue;
          }
          bakePathRotation(p);
        } else {
          if (pMaxX < capMinX || pMinX > capMaxX || pMaxY < capMinY || pMinY > capMaxY) {
            newPaths.push(p);
            continue;
          }
        }

        if (p.points.length === 1) {
          const pt = p.points[0];
          const hit = intersectSegmentCapsule(pt.x, pt.y, pt.x, pt.y, pos1.x, pos1.y, pos2.x, pos2.y, radius);
          if (hit) {
            changed = true;
          } else {
            newPaths.push(p);
          }
          continue;
        }

        let currentSegment = [];
        let pathModified = false;

        const flushSegment = () => {
          if (currentSegment.length > 0) {
            newPaths.push({
              type: p.type,
              color: p.color,
              size: p.size,
              opacity: p.opacity,
              rotation: 0,
              points: currentSegment
            });
            currentSegment = [];
          }
        };

        for (let i = 0; i < p.points.length - 1; i++) {
          const a = p.points[i];
          const b = p.points[i + 1];
          const hit = intersectSegmentCapsule(a.x, a.y, b.x, b.y, pos1.x, pos1.y, pos2.x, pos2.y, radius);

          if (!hit) {
            pushPointDedup(currentSegment, { x: a.x, y: a.y, t: a.t, p: a.p });
            pushPointDedup(currentSegment, { x: b.x, y: b.y, t: b.t, p: b.p });
          } else {
            pathModified = true;
            changed = true;
            const [tEnter, tExit] = hit;
            if (tEnter > 1e-4) {
              pushPointDedup(currentSegment, { x: a.x, y: a.y, t: a.t, p: a.p });
              pushPointDedup(currentSegment, interpolateStrokePoint(a, b, tEnter));
            }
            flushSegment();
            if (tExit < 1 - 1e-4) {
              pushPointDedup(currentSegment, interpolateStrokePoint(a, b, tExit));
              pushPointDedup(currentSegment, { x: b.x, y: b.y, t: b.t, p: b.p });
            }
          }
        }

        if (!pathModified) {
          newPaths.push(p);
        } else {
          flushSegment();
        }
      }

      if (changed) {
        paths = newPaths;
        pages[currentPageIndex].paths = paths;
        scheduleRedraw();
      }
    }

    function eraseObjectAt(pos) {
      const radius = Math.max(20 / viewScale, parseInt(sizeRange.value) * 1.5);
      let changed = false;
      const pCount = paths.length;
      paths = paths.filter(p => !p.points.some(pt => Math.hypot(pt.x - pos.x, pt.y - pos.y) <= radius));
      if (paths.length !== pCount) changed = true;
      const imgCount = images.length;
      images = images.filter(img => !(pos.x >= img.x && pos.x <= img.x + img.w && pos.y >= img.y && pos.y <= img.y + img.h));
      if (images.length !== imgCount) changed = true;
      if (changed) { pages[currentPageIndex].paths = paths; pages[currentPageIndex].images = images; scheduleRedraw(); }
    }

    function isPointInPolygon(point, polygon) {
      let x = point.x, y = point.y, inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        let xi = polygon[i].x, yi = polygon[i].y, xj = polygon[j].x, yj = polygon[j].y;
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }

    clearBtn.addEventListener('click', () => {
      if (paths.length > 0 || images.length > 0) {
        recordUndoStep();
      }
      pages[currentPageIndex].paths = []; pages[currentPageIndex].images = [];
      paths = pages[currentPageIndex].paths; images = pages[currentPageIndex].images;
      selectedPaths = []; selectedImages = []; groupBounds = null; origGroupBounds = null;
      topRightMenuWrapper.style.display = 'none'; objectMenu.classList.remove('show'); opacitySubPanel.classList.remove('show'); canvasMenu.style.display = 'none';
      resetViewTransform();
      redraw(); saveProgress();
    });

    function computeInfiniteContentBounds() {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

      function expandRotatedRect(x, y, w, h, rot, pad = 0) {
        const cx = x + w / 2;
        const cy = y + h / 2;
        const cos = rot ? Math.cos(rot) : 1;
        const sin = rot ? Math.sin(rot) : 0;
        const corners = [
          { x: x, y: y },
          { x: x + w, y: y },
          { x: x + w, y: y + h },
          { x: x, y: y + h }
        ];
        corners.forEach(c => {
          const rx = cx + (c.x - cx) * cos - (c.y - cy) * sin;
          const ry = cy + (c.x - cx) * sin + (c.y - cy) * cos;
          if (rx - pad < minX) minX = rx - pad;
          if (ry - pad < minY) minY = ry - pad;
          if (rx + pad > maxX) maxX = rx + pad;
          if (ry + pad > maxY) maxY = ry + pad;
        });
      }

      images.forEach(imgObj => {
        expandRotatedRect(imgObj.x, imgObj.y, imgObj.w, imgObj.h, imgObj.rotation || 0, 0);
      });

      paths.forEach(p => {
        if (!p.points || p.points.length === 0) return;
        let pMinX = Infinity, pMinY = Infinity, pMaxX = -Infinity, pMaxY = -Infinity;
        p.points.forEach(pt => {
          if (pt.x < pMinX) pMinX = pt.x;
          if (pt.y < pMinY) pMinY = pt.y;
          if (pt.x > pMaxX) pMaxX = pt.x;
          if (pt.y > pMaxY) pMaxY = pt.y;
        });
        const pad = p.type === 'highlighter' ? p.size * 1.5 : p.size;
        expandRotatedRect(pMinX, pMinY, pMaxX - pMinX, pMaxY - pMinY, p.rotation || 0, pad);
      });

      if (minX === Infinity) return null;
      const margin = 40;
      return {
        x: Math.floor(minX - margin),
        y: Math.floor(minY - margin),
        w: Math.max(100, Math.ceil(maxX - minX + margin * 2)),
        h: Math.max(100, Math.ceil(maxY - minY + margin * 2))
      };
    }

    function saveDrawingFile() {
      if (paths.length === 0 && images.length === 0) return;
      let fileName = prompt(`請輸入「第 ${currentPageIndex + 1} 頁」的檔案名稱：`, `數位白板_第${currentPageIndex + 1}頁`);
      if (fileName !== null) {
        fileName = fileName.trim() === "" ? `drawing_page_${currentPageIndex + 1}` : fileName.trim();
        const bounds = computeInfiniteContentBounds();
        if (!bounds) return;

        const dpr = window.devicePixelRatio || 1;
        const exportScale = Math.min(dpr, 4096 / bounds.w, 4096 / bounds.h);
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = Math.max(1, Math.round(bounds.w * exportScale));
        exportCanvas.height = Math.max(1, Math.round(bounds.h * exportScale));
        const exportCtx = exportCanvas.getContext('2d');

        exportCtx.fillStyle = '#ffffff';
        exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

        exportCtx.scale(exportScale, exportScale);
        exportCtx.translate(-bounds.x, -bounds.y);
        renderPageContent(exportCtx);

        const link = document.createElement('a');
        link.download = fileName + '.png';
        link.href = exportCanvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    saveBtn.addEventListener('click', () => saveDrawingFile());
    window.addEventListener('beforeunload', () => saveProgress());
  </script>
</body>
</html>
